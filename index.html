<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DingDing 番茄钟</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated background blobs -->
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <!-- ======== Focus Tab ======== -->
    <div class="app-container" id="focus-tab">
        <!-- Setup Screen -->
        <div id="setup-screen" class="screen">
            <div class="setup-card glass-card">
                <h1 class="app-title">DingDing 番茄钟</h1>

                <!-- Phase 1: CTA -->
                <div id="setup-phase1">
                    <p class="subtitle">准备好了吗？</p>
                    <button id="start-flow-btn" class="glass-btn start-btn">当个事儿办</button>
                </div>

                <!-- Phase 2: Name + Time (hidden initially) -->
                <div id="setup-phase2" class="hidden">
                    <input type="text" id="task-name-input" class="task-input" placeholder="你要办什么事儿？" maxlength="20">
                    <p class="time-label">选择专注时间</p>
                    <div class="time-options">
                        <button class="time-btn glass-btn" data-minutes="15">15 分钟</button>
                        <button class="time-btn glass-btn" data-minutes="30">30 分钟</button>
                        <button class="time-btn glass-btn" data-minutes="45">45 分钟</button>
                        <button class="time-btn glass-btn" data-minutes="60">60 分钟</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Timer Screen -->
        <div id="timer-screen" class="screen hidden">
            <div class="timer-task-name" id="timer-task-name"></div>
            <!-- Stats bar -->
            <div class="stats-bar">
                <div class="stat-item glass-card">
                    <span class="stat-label">剩余时间</span>
                    <span id="time-display" class="stat-value time-value">00:00</span>
                </div>
                <div class="stat-item glass-card">
                    <span class="stat-label">顶的次数</span>
                    <span id="ding-count" class="stat-value count-value">0</span>
                </div>
                <div class="stat-item glass-card">
                    <span class="stat-label">萎的次数</span>
                    <span id="wei-count" class="stat-value count-value">0</span>
                </div>
            </div>

            <!-- Flower area -->
            <div class="flower-container">
                <svg id="flower-svg" class="flower" viewBox="0 0 200 320" width="220" height="350">
                    <defs>
                        <radialGradient id="petal-grad-1" cx="50%" cy="30%" r="70%">
                            <stop offset="0%" stop-color="#FFB3BA"/>
                            <stop offset="100%" stop-color="#FF6B81"/>
                        </radialGradient>
                        <radialGradient id="petal-grad-2" cx="50%" cy="30%" r="70%">
                            <stop offset="0%" stop-color="#FFC3A0"/>
                            <stop offset="100%" stop-color="#FF7E67"/>
                        </radialGradient>
                        <radialGradient id="center-grad" cx="40%" cy="40%" r="60%">
                            <stop offset="0%" stop-color="#FFE082"/>
                            <stop offset="100%" stop-color="#FFB300"/>
                        </radialGradient>
                    </defs>

                    <!-- Lower stem -->
                    <path class="stem lower-stem" d="M100,160 C100,200 100,250 100,295" stroke="#66BB6A" stroke-width="5" fill="none" stroke-linecap="round"/>

                    <!-- Left leaf -->
                    <path class="leaf left-leaf" d="M100,215 C78,198 55,205 50,222 C55,232 78,230 100,215Z" fill="#81C784"/>
                    <path class="leaf-vein" d="M98,216 C82,210 65,215 55,224" stroke="#66BB6A" stroke-width="1" fill="none"/>

                    <!-- Right leaf -->
                    <path class="leaf right-leaf" d="M100,252 C122,235 145,242 150,259 C145,269 122,267 100,252Z" fill="#81C784"/>
                    <path class="leaf-vein" d="M102,253 C118,247 135,252 145,261" stroke="#66BB6A" stroke-width="1" fill="none"/>

                    <!-- Flower head group -->
                    <g class="flower-head">
                        <path class="stem upper-stem" d="M100,105 L100,160" stroke="#66BB6A" stroke-width="5" fill="none" stroke-linecap="round"/>
                        <ellipse class="petal" cx="100" cy="58" rx="16" ry="32" fill="url(#petal-grad-1)" opacity="0.8" transform="rotate(0 100 92)"/>
                        <ellipse class="petal" cx="100" cy="58" rx="16" ry="32" fill="url(#petal-grad-2)" opacity="0.8" transform="rotate(60 100 92)"/>
                        <ellipse class="petal" cx="100" cy="58" rx="16" ry="32" fill="url(#petal-grad-1)" opacity="0.8" transform="rotate(120 100 92)"/>
                        <ellipse class="petal" cx="100" cy="58" rx="16" ry="32" fill="url(#petal-grad-2)" opacity="0.8" transform="rotate(180 100 92)"/>
                        <ellipse class="petal" cx="100" cy="58" rx="16" ry="32" fill="url(#petal-grad-1)" opacity="0.8" transform="rotate(240 100 92)"/>
                        <ellipse class="petal" cx="100" cy="58" rx="16" ry="32" fill="url(#petal-grad-2)" opacity="0.8" transform="rotate(300 100 92)"/>
                        <ellipse class="petal inner-petal" cx="100" cy="66" rx="12" ry="24" fill="url(#petal-grad-2)" opacity="0.9" transform="rotate(30 100 92)"/>
                        <ellipse class="petal inner-petal" cx="100" cy="66" rx="12" ry="24" fill="url(#petal-grad-1)" opacity="0.9" transform="rotate(90 100 92)"/>
                        <ellipse class="petal inner-petal" cx="100" cy="66" rx="12" ry="24" fill="url(#petal-grad-2)" opacity="0.9" transform="rotate(150 100 92)"/>
                        <ellipse class="petal inner-petal" cx="100" cy="66" rx="12" ry="24" fill="url(#petal-grad-1)" opacity="0.9" transform="rotate(210 100 92)"/>
                        <ellipse class="petal inner-petal" cx="100" cy="66" rx="12" ry="24" fill="url(#petal-grad-2)" opacity="0.9" transform="rotate(270 100 92)"/>
                        <ellipse class="petal inner-petal" cx="100" cy="66" rx="12" ry="24" fill="url(#petal-grad-1)" opacity="0.9" transform="rotate(330 100 92)"/>
                        <circle class="center-outer" cx="100" cy="92" r="20" fill="url(#center-grad)"/>
                        <circle class="center-inner" cx="100" cy="92" r="12" fill="#F9A825"/>
                        <circle cx="96" cy="89" r="2" fill="#F57F17" opacity="0.6"/>
                        <circle cx="104" cy="89" r="2" fill="#F57F17" opacity="0.6"/>
                        <circle cx="100" cy="96" r="2" fill="#F57F17" opacity="0.6"/>
                        <circle cx="93" cy="94" r="1.5" fill="#F57F17" opacity="0.4"/>
                        <circle cx="107" cy="94" r="1.5" fill="#F57F17" opacity="0.4"/>
                    </g>
                </svg>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button id="reset-btn" class="control-btn glass-btn abandon-btn">放弃</button>
            </div>
        </div>

        <!-- Completion overlay -->
        <div id="completion-screen" class="screen hidden">
            <div class="completion-card glass-card">
                <h2 class="completion-title">专注完成！</h2>
                <p class="completion-subtitle">辛苦了，休息一下吧</p>
                <div class="completion-stats">
                    <div class="completion-stat">
                        <span class="completion-stat-value" id="final-duration">0</span>
                        <span class="completion-stat-label">专注时长(分钟)</span>
                    </div>
                    <div class="completion-stat">
                        <span class="completion-stat-value" id="final-ding">0</span>
                        <span class="completion-stat-label">顶的次数</span>
                    </div>
                    <div class="completion-stat">
                        <span class="completion-stat-value" id="final-wei">0</span>
                        <span class="completion-stat-label">萎的次数</span>
                    </div>
                </div>
                <button id="restart-btn" class="control-btn glass-btn">再来一次</button>
            </div>
        </div>

        <!-- Checkpoint Modal -->
        <div id="modal" class="modal hidden">
            <div class="modal-overlay"></div>
            <div class="modal-content glass-card">
                <p id="modal-text" class="modal-text"></p>
                <div class="modal-buttons">
                    <button id="ding-btn" class="modal-btn ding-btn">顶！</button>
                    <button id="wei-btn" class="modal-btn wei-btn">萎...</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ======== Notebook Tab ======== -->
    <div class="notebook-container hidden" id="notebook-tab">
        <h2 class="notebook-title">顶顶钟记事本</h2>
        <p class="notebook-subtitle" id="notebook-subtitle"></p>
        <div id="records-list" class="records-list"></div>
        <div id="empty-state" class="empty-state">还没有记录，去开始一次专注吧</div>
        <button id="clear-records-btn" class="clear-records-btn hidden">清空所有记录</button>
    </div>

    <!-- ======== Bottom Tab Bar ======== -->
    <div class="tab-bar">
        <button class="tab-btn active" data-tab="focus">专注</button>
        <button class="tab-btn" data-tab="notebook">顶顶钟记事本</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
