<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DingDing 番茄钟</title>
    <style>
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 70%, #1a1a2e 100%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    color: #fff;
}

/* --- Background Blobs --- */
.bg-blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.4;
    z-index: 0;
    pointer-events: none;
}
.blob-1 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, #e94560, #c62a7a);
    top: -100px; left: -100px;
    animation: float-1 18s ease-in-out infinite;
}
.blob-2 {
    width: 350px; height: 350px;
    background: radial-gradient(circle, #533483, #7952b3);
    bottom: -80px; right: -80px;
    animation: float-2 22s ease-in-out infinite;
}
.blob-3 {
    width: 300px; height: 300px;
    background: radial-gradient(circle, #0f3460, #1687a7);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    animation: float-3 20s ease-in-out infinite;
}
@keyframes float-1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(80px, 60px) scale(1.1); }
    66% { transform: translate(-40px, 100px) scale(0.95); }
}
@keyframes float-2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(-60px, -80px) scale(1.15); }
    66% { transform: translate(50px, -40px) scale(0.9); }
}
@keyframes float-3 {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    33% { transform: translate(-40%, -60%) scale(1.1); }
    66% { transform: translate(-60%, -40%) scale(0.95); }
}

/* --- Glass Card --- */
.glass-card {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1);
}

/* --- Screen Basics --- */
.screen {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: fadeIn 0.5s ease;
}
.screen.hidden { display: none; }
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* --- Focus Tab (app-container) --- */
.app-container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    padding-bottom: 80px;
}

/* --- Notebook Tab --- */
.notebook-container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    padding: 40px 20px 80px;
    overflow-y: auto;
}
.notebook-container.hidden { display: none; }

.notebook-title {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #FFB3BA, #FFC3A0, #FFE082);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-align: center;
}
.notebook-subtitle {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.4);
    text-align: center;
    margin-bottom: 28px;
}
.records-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.record-entry {
    padding: 18px 20px;
}
.record-text {
    font-size: 14px;
    line-height: 1.9;
    color: rgba(255, 255, 255, 0.8);
}
.quality-high {
    color: #66BB6A;
    font-weight: 700;
}
.quality-mid {
    color: #FFB300;
    font-weight: 700;
}
.quality-low {
    color: #EF5350;
    font-weight: 700;
}
.empty-state {
    text-align: center;
    padding: 60px 20px;
    color: rgba(255, 255, 255, 0.3);
    font-size: 15px;
}
.empty-state.hidden { display: none; }
.clear-records-btn {
    display: block;
    margin: 24px auto 0;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    color: rgba(255, 255, 255, 0.3);
    font-size: 12px;
    padding: 8px 16px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.3s ease;
}
.clear-records-btn:hover {
    border-color: rgba(239, 83, 80, 0.4);
    color: rgba(239, 83, 80, 0.7);
}
.clear-records-btn.hidden { display: none; }

/* --- Tab Bar --- */
.tab-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    background: rgba(15, 15, 30, 0.88);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    padding: 10px 20px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    z-index: 80;
    gap: 8px;
}
.tab-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: rgba(255, 255, 255, 0.35);
    font-size: 14px;
    font-weight: 600;
    padding: 10px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
}
.tab-btn.active {
    background: rgba(255, 255, 255, 0.1);
    color: rgba(255, 255, 255, 0.9);
}
.tab-btn:hover:not(.active) {
    color: rgba(255, 255, 255, 0.55);
}

/* --- Setup Screen --- */
.setup-card {
    padding: 48px 36px;
    text-align: center;
    width: 100%;
}
.app-title {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #FFB3BA, #FFC3A0, #FFE082);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.subtitle {
    font-size: 16px;
    color: rgba(255, 255, 255, 0.6);
    margin-bottom: 36px;
}

/* Phase 1 */
.start-btn {
    font-size: 20px;
    font-weight: 700;
    padding: 22px 40px;
    background: linear-gradient(135deg, rgba(255, 179, 186, 0.2), rgba(255, 195, 160, 0.2));
    border-color: rgba(255, 179, 186, 0.3);
    font-family: inherit;
    letter-spacing: 2px;
}
.start-btn:hover {
    background: linear-gradient(135deg, rgba(255, 179, 186, 0.3), rgba(255, 195, 160, 0.3));
    border-color: rgba(255, 179, 186, 0.5);
}

/* Phase 2 */
#setup-phase2 {
    animation: fadeIn 0.4s ease;
}
#setup-phase2.hidden { display: none; }

.task-input {
    width: 100%;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px;
    padding: 16px 20px;
    color: #fff;
    font-size: 16px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.3s ease;
    margin-bottom: 28px;
    text-align: center;
}
.task-input:focus {
    border-color: rgba(255, 255, 255, 0.3);
}
.task-input::placeholder {
    color: rgba(255, 255, 255, 0.3);
}
.time-label {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.45);
    margin-bottom: 16px;
}
.time-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

/* --- Glass Buttons --- */
.glass-btn {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    color: #fff;
    font-size: 18px;
    font-weight: 600;
    padding: 18px 24px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
}
.glass-btn:hover {
    background: rgba(255, 255, 255, 0.18);
    border-color: rgba(255, 255, 255, 0.3);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
}
.glass-btn:active {
    transform: translateY(0);
    background: rgba(255, 255, 255, 0.22);
}
.time-btn { font-family: inherit; }

/* --- Timer Screen --- */
#timer-screen {
    justify-content: flex-start;
    padding-top: 8vh;
    min-height: 100vh;
}
.timer-task-name {
    font-size: 18px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.7);
    margin-bottom: 20px;
    padding: 8px 20px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
}
.stats-bar {
    display: flex;
    gap: 12px;
    width: 100%;
    margin-bottom: 32px;
}
.stat-item {
    flex: 1;
    padding: 16px 12px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.stat-label {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.5);
    letter-spacing: 1px;
    text-transform: uppercase;
}
.stat-value {
    font-size: 24px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
}
.time-value {
    font-size: 28px;
    background: linear-gradient(135deg, #FFE082, #FFB300);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.count-value { color: rgba(255, 255, 255, 0.9); }

/* --- Flower --- */
.flower-container {
    display: flex;
    justify-content: center;
    align-items: center;
    flex: 1;
    min-height: 350px;
    margin-bottom: 24px;
}
.flower { transition: filter 1.2s ease; }
.flower .flower-head { transform-origin: 100px 160px; transition: transform 1.2s ease; }
.flower .leaf { transition: transform 1s ease, fill 1.2s ease; }
.flower .leaf-vein { transition: stroke 1.2s ease; }
.flower .stem { transition: stroke 1.2s ease; }
.flower:not(.wilted) .flower-head { animation: gentle-sway 4s ease-in-out infinite; }
@keyframes gentle-sway {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(2deg); }
    75% { transform: rotate(-2deg); }
}
.flower.wilted { filter: saturate(0.15) brightness(0.65) sepia(0.5); }
.flower.wilted .flower-head { transform: rotate(45deg); animation: none; }
.flower.wilted .left-leaf { transform-origin: 100px 215px; transform: rotate(15deg) translateY(8px); }
.flower.wilted .right-leaf { transform-origin: 100px 252px; transform: rotate(-15deg) translateY(8px); }

/* --- Controls --- */
.controls {
    width: 100%;
    display: flex;
    justify-content: center;
    padding-bottom: 40px;
}
.control-btn { font-family: inherit; min-width: 160px; }

/* --- Abandon Button --- */
.abandon-btn {
    background: rgba(239, 83, 80, 0.08);
    border-color: rgba(239, 83, 80, 0.2);
    color: rgba(255, 255, 255, 0.5);
    font-size: 15px;
    padding: 14px 24px;
}
.abandon-btn:hover {
    background: rgba(239, 83, 80, 0.18);
    border-color: rgba(239, 83, 80, 0.35);
    color: rgba(255, 255, 255, 0.75);
}
.abandon-btn:active {
    background: rgba(239, 83, 80, 0.25);
}

/* --- Modal --- */
.modal {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    animation: fadeIn 0.3s ease;
}
.modal.hidden { display: none; }
.modal-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}
.modal-content {
    position: relative;
    z-index: 1;
    padding: 40px 32px;
    text-align: center;
    max-width: 380px;
    width: 90%;
    animation: modal-pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes modal-pop {
    from { opacity: 0; transform: scale(0.8) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-text {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.6;
    margin-bottom: 32px;
    color: rgba(255, 255, 255, 0.95);
}
.modal-buttons {
    display: flex;
    gap: 16px;
    justify-content: center;
}
.modal-btn {
    flex: 1;
    padding: 16px 24px;
    border-radius: 16px;
    border: none;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
}
.ding-btn {
    background: linear-gradient(135deg, #66BB6A, #43A047);
    color: #fff;
    box-shadow: 0 4px 16px rgba(76, 175, 80, 0.3);
}
.ding-btn:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 6px 24px rgba(76, 175, 80, 0.4); }
.ding-btn:active { transform: translateY(0) scale(0.98); }
.wei-btn {
    background: linear-gradient(135deg, #78909C, #546E7A);
    color: #fff;
    box-shadow: 0 4px 16px rgba(84, 110, 122, 0.3);
}
.wei-btn:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 6px 24px rgba(84, 110, 122, 0.4); }
.wei-btn:active { transform: translateY(0) scale(0.98); }

/* --- Completion Screen --- */
#completion-screen {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 50;
    justify-content: center;
    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}
.completion-card {
    padding: 48px 36px;
    text-align: center;
    max-width: 400px;
    width: 90%;
    animation: modal-pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.completion-title {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #FFE082, #FFB300);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.completion-subtitle {
    font-size: 16px;
    color: rgba(255, 255, 255, 0.6);
    margin-bottom: 32px;
}
.completion-stats {
    display: flex;
    gap: 16px;
    margin-bottom: 32px;
}
.completion-stat {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.completion-stat-value {
    font-size: 28px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.95);
}
.completion-stat-label {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.45);
    letter-spacing: 0.5px;
}

@keyframes timer-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
}
.time-value.running { animation: timer-pulse 2s ease-in-out infinite; }

/* --- Responsive --- */
@media (max-width: 400px) {
    .app-container { padding: 12px; padding-bottom: 80px; }
    .setup-card { padding: 36px 24px; }
    .app-title { font-size: 26px; }
    .stats-bar { gap: 8px; }
    .stat-item { padding: 12px 8px; }
    .stat-value { font-size: 20px; }
    .time-value { font-size: 22px; }
    .stat-label { font-size: 10px; }
    .modal-content { padding: 28px 20px; }
    .modal-text { font-size: 17px; }
    .modal-btn { font-size: 18px; padding: 14px 18px; }
    .start-btn { font-size: 18px; padding: 18px 32px; }
}
@media (max-height: 700px) {
    #timer-screen { padding-top: 4vh; }
    .flower-container { min-height: 280px; }
    .flower-container svg { width: 180px; height: 280px; }
}
    </style>
</head>
<body>
    <!-- Background blobs -->
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <!-- ======== Focus Tab ======== -->
    <div class="app-container" id="focus-tab">
        <!-- Setup Screen -->
        <div id="setup-screen" class="screen">
            <div class="setup-card glass-card">
                <h1 class="app-title">DingDing 番茄钟</h1>

                <!-- Phase 1: CTA -->
                <div id="setup-phase1">
                    <p class="subtitle">准备好了吗？</p>
                    <button id="start-flow-btn" class="glass-btn start-btn">当个事儿办</button>
                </div>

                <!-- Phase 2: Name + Time (hidden initially) -->
                <div id="setup-phase2" class="hidden">
                    <input type="text" id="task-name-input" class="task-input" placeholder="你要办什么事儿？" maxlength="20">
                    <p class="time-label">选择专注时间</p>
                    <div class="time-options">
                        <button class="time-btn glass-btn" data-minutes="15">15 分钟</button>
                        <button class="time-btn glass-btn" data-minutes="30">30 分钟</button>
                        <button class="time-btn glass-btn" data-minutes="45">45 分钟</button>
                        <button class="time-btn glass-btn" data-minutes="60">60 分钟</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Timer Screen -->
        <div id="timer-screen" class="screen hidden">
            <div class="timer-task-name" id="timer-task-name"></div>
            <div class="stats-bar">
                <div class="stat-item glass-card">
                    <span class="stat-label">剩余时间</span>
                    <span id="time-display" class="stat-value time-value">00:00</span>
                </div>
                <div class="stat-item glass-card">
                    <span class="stat-label">顶的次数</span>
                    <span id="ding-count" class="stat-value count-value">0</span>
                </div>
                <div class="stat-item glass-card">
                    <span class="stat-label">萎的次数</span>
                    <span id="wei-count" class="stat-value count-value">0</span>
                </div>
            </div>

            <div class="flower-container">
                <svg id="flower-svg" class="flower" viewBox="0 0 200 320" width="220" height="350">
                    <defs>
                        <radialGradient id="petal-grad-1" cx="50%" cy="30%" r="70%">
                            <stop offset="0%" stop-color="#FFB3BA"/>
                            <stop offset="100%" stop-color="#FF6B81"/>
                        </radialGradient>
                        <radialGradient id="petal-grad-2" cx="50%" cy="30%" r="70%">
                            <stop offset="0%" stop-color="#FFC3A0"/>
                            <stop offset="100%" stop-color="#FF7E67"/>
                        </radialGradient>
                        <radialGradient id="center-grad" cx="40%" cy="40%" r="60%">
                            <stop offset="0%" stop-color="#FFE082"/>
                            <stop offset="100%" stop-color="#FFB300"/>
                        </radialGradient>
                    </defs>
                    <path class="stem lower-stem" d="M100,160 C100,200 100,250 100,295" stroke="#66BB6A" stroke-width="5" fill="none" stroke-linecap="round"/>
                    <path class="leaf left-leaf" d="M100,215 C78,198 55,205 50,222 C55,232 78,230 100,215Z" fill="#81C784"/>
                    <path class="leaf-vein" d="M98,216 C82,210 65,215 55,224" stroke="#66BB6A" stroke-width="1" fill="none"/>
                    <path class="leaf right-leaf" d="M100,252 C122,235 145,242 150,259 C145,269 122,267 100,252Z" fill="#81C784"/>
                    <path class="leaf-vein" d="M102,253 C118,247 135,252 145,261" stroke="#66BB6A" stroke-width="1" fill="none"/>
                    <g class="flower-head">
                        <path class="stem upper-stem" d="M100,105 L100,160" stroke="#66BB6A" stroke-width="5" fill="none" stroke-linecap="round"/>
                        <ellipse class="petal" cx="100" cy="58" rx="16" ry="32" fill="url(#petal-grad-1)" opacity="0.8" transform="rotate(0 100 92)"/>
                        <ellipse class="petal" cx="100" cy="58" rx="16" ry="32" fill="url(#petal-grad-2)" opacity="0.8" transform="rotate(60 100 92)"/>
                        <ellipse class="petal" cx="100" cy="58" rx="16" ry="32" fill="url(#petal-grad-1)" opacity="0.8" transform="rotate(120 100 92)"/>
                        <ellipse class="petal" cx="100" cy="58" rx="16" ry="32" fill="url(#petal-grad-2)" opacity="0.8" transform="rotate(180 100 92)"/>
                        <ellipse class="petal" cx="100" cy="58" rx="16" ry="32" fill="url(#petal-grad-1)" opacity="0.8" transform="rotate(240 100 92)"/>
                        <ellipse class="petal" cx="100" cy="58" rx="16" ry="32" fill="url(#petal-grad-2)" opacity="0.8" transform="rotate(300 100 92)"/>
                        <ellipse class="petal inner-petal" cx="100" cy="66" rx="12" ry="24" fill="url(#petal-grad-2)" opacity="0.9" transform="rotate(30 100 92)"/>
                        <ellipse class="petal inner-petal" cx="100" cy="66" rx="12" ry="24" fill="url(#petal-grad-1)" opacity="0.9" transform="rotate(90 100 92)"/>
                        <ellipse class="petal inner-petal" cx="100" cy="66" rx="12" ry="24" fill="url(#petal-grad-2)" opacity="0.9" transform="rotate(150 100 92)"/>
                        <ellipse class="petal inner-petal" cx="100" cy="66" rx="12" ry="24" fill="url(#petal-grad-1)" opacity="0.9" transform="rotate(210 100 92)"/>
                        <ellipse class="petal inner-petal" cx="100" cy="66" rx="12" ry="24" fill="url(#petal-grad-2)" opacity="0.9" transform="rotate(270 100 92)"/>
                        <ellipse class="petal inner-petal" cx="100" cy="66" rx="12" ry="24" fill="url(#petal-grad-1)" opacity="0.9" transform="rotate(330 100 92)"/>
                        <circle class="center-outer" cx="100" cy="92" r="20" fill="url(#center-grad)"/>
                        <circle class="center-inner" cx="100" cy="92" r="12" fill="#F9A825"/>
                        <circle cx="96" cy="89" r="2" fill="#F57F17" opacity="0.6"/>
                        <circle cx="104" cy="89" r="2" fill="#F57F17" opacity="0.6"/>
                        <circle cx="100" cy="96" r="2" fill="#F57F17" opacity="0.6"/>
                        <circle cx="93" cy="94" r="1.5" fill="#F57F17" opacity="0.4"/>
                        <circle cx="107" cy="94" r="1.5" fill="#F57F17" opacity="0.4"/>
                    </g>
                </svg>
            </div>

            <div class="controls">
                <button id="reset-btn" class="control-btn glass-btn abandon-btn">我承认，我萎了</button>
            </div>
        </div>

        <!-- Completion overlay -->
        <div id="completion-screen" class="screen hidden">
            <div class="completion-card glass-card">
                <h2 class="completion-title">专注完成！</h2>
                <p class="completion-subtitle">辛苦了，休息一下吧</p>
                <div class="completion-stats">
                    <div class="completion-stat">
                        <span class="completion-stat-value" id="final-duration">0</span>
                        <span class="completion-stat-label">专注时长(分钟)</span>
                    </div>
                    <div class="completion-stat">
                        <span class="completion-stat-value" id="final-ding">0</span>
                        <span class="completion-stat-label">顶的次数</span>
                    </div>
                    <div class="completion-stat">
                        <span class="completion-stat-value" id="final-wei">0</span>
                        <span class="completion-stat-label">萎的次数</span>
                    </div>
                </div>
                <button id="restart-btn" class="control-btn glass-btn">再来一次</button>
            </div>
        </div>

        <!-- Checkpoint Modal -->
        <div id="modal" class="modal hidden">
            <div class="modal-overlay"></div>
            <div class="modal-content glass-card">
                <p id="modal-text" class="modal-text"></p>
                <div class="modal-buttons">
                    <button id="ding-btn" class="modal-btn ding-btn">顶！</button>
                    <button id="wei-btn" class="modal-btn wei-btn">萎...</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ======== Notebook Tab ======== -->
    <div class="notebook-container hidden" id="notebook-tab">
        <h2 class="notebook-title">顶顶钟记事本</h2>
        <p class="notebook-subtitle" id="notebook-subtitle"></p>
        <div id="records-list" class="records-list"></div>
        <div id="empty-state" class="empty-state">还没有记录，去开始一次专注吧</div>
        <button id="clear-records-btn" class="clear-records-btn hidden">清空所有记录</button>
    </div>

    <!-- ======== Bottom Tab Bar ======== -->
    <div class="tab-bar">
        <button class="tab-btn active" data-tab="focus">专注</button>
        <button class="tab-btn" data-tab="notebook">顶顶钟记事本</button>
    </div>

    <script>
(function () {
    'use strict';

    // --- State ---
    var state = {
        taskName: '',
        originalDuration: 0,
        durationMinutes: 0,
        remainingSeconds: 0,
        elapsedSeconds: 0,
        dingCount: 0,
        weiCount: 0,
        timerInterval: null,
        isPaused: false,
        recorded: false,
        startTime: null,
        checkpoints: { third: false, half: false, twoThirds: false }
    };

    // --- DOM ---
    var dom = {
        focusTab: document.getElementById('focus-tab'),
        notebookTab: document.getElementById('notebook-tab'),
        tabBtns: document.querySelectorAll('.tab-btn'),
        setupScreen: document.getElementById('setup-screen'),
        timerScreen: document.getElementById('timer-screen'),
        completionScreen: document.getElementById('completion-screen'),
        modal: document.getElementById('modal'),
        modalText: document.getElementById('modal-text'),
        setupPhase1: document.getElementById('setup-phase1'),
        setupPhase2: document.getElementById('setup-phase2'),
        startFlowBtn: document.getElementById('start-flow-btn'),
        taskNameInput: document.getElementById('task-name-input'),
        timerTaskName: document.getElementById('timer-task-name'),
        timeDisplay: document.getElementById('time-display'),
        dingCount: document.getElementById('ding-count'),
        weiCount: document.getElementById('wei-count'),
        flower: document.getElementById('flower-svg'),
        dingBtn: document.getElementById('ding-btn'),
        weiBtn: document.getElementById('wei-btn'),
        resetBtn: document.getElementById('reset-btn'),
        restartBtn: document.getElementById('restart-btn'),
        finalDuration: document.getElementById('final-duration'),
        finalDing: document.getElementById('final-ding'),
        finalWei: document.getElementById('final-wei'),
        timeBtns: document.querySelectorAll('.time-btn'),
        recordsList: document.getElementById('records-list'),
        emptyState: document.getElementById('empty-state'),
        notebookSubtitle: document.getElementById('notebook-subtitle'),
        clearRecordsBtn: document.getElementById('clear-records-btn')
    };

    // --- Init ---
    function init() {
        // "当个事儿办" button -> show phase 2
        dom.startFlowBtn.addEventListener('click', function () {
            dom.setupPhase1.style.display = 'none';
            dom.setupPhase2.classList.remove('hidden');
            dom.taskNameInput.value = '';
            dom.taskNameInput.focus();
        });

        // Time selection
        dom.timeBtns.forEach(function (btn) {
            btn.addEventListener('click', function () {
                startTimer(parseInt(this.dataset.minutes, 10));
            });
        });

        // Checkpoint modal buttons
        dom.dingBtn.addEventListener('click', handleDing);
        dom.weiBtn.addEventListener('click', handleWei);

        // Reset / Restart
        dom.resetBtn.addEventListener('click', function () {
            resetToSetup(false);
        });
        dom.restartBtn.addEventListener('click', function () {
            resetToSetup(true);
        });

        // Tab switching
        dom.tabBtns.forEach(function (btn) {
            btn.addEventListener('click', function () {
                switchTab(this.dataset.tab);
            });
        });

        // Clear records
        dom.clearRecordsBtn.addEventListener('click', function () {
            if (confirm('确定要清空所有记录吗？')) {
                localStorage.removeItem('dingding-records');
                renderNotebook();
            }
        });

        // Enter key in name input -> focus first time button
        dom.taskNameInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                dom.timeBtns[0].focus();
            }
        });

        // Swipe gesture for tab switching
        var touchStartX = 0;
        var touchStartY = 0;
        document.addEventListener('touchstart', function (e) {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });
        document.addEventListener('touchend', function (e) {
            var dx = e.changedTouches[0].screenX - touchStartX;
            var dy = e.changedTouches[0].screenY - touchStartY;
            if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 1.5) {
                if (dx < 0) {
                    switchTab('notebook');
                } else {
                    switchTab('focus');
                }
            }
        }, { passive: true });
    }

    // --- Tab Switching ---
    function switchTab(tab) {
        dom.tabBtns.forEach(function (btn) {
            btn.classList.toggle('active', btn.dataset.tab === tab);
        });

        if (tab === 'focus') {
            dom.focusTab.style.display = '';
            dom.notebookTab.classList.add('hidden');
        } else {
            dom.focusTab.style.display = 'none';
            dom.notebookTab.classList.remove('hidden');
            renderNotebook();
        }
    }

    // --- Start Timer ---
    function startTimer(minutes) {
        var nameVal = dom.taskNameInput.value.trim();
        state.taskName = nameVal || '专注';
        state.originalDuration = minutes * 60;
        state.durationMinutes = minutes;
        state.startTime = new Date();
        state.remainingSeconds = state.originalDuration;
        state.elapsedSeconds = 0;
        state.dingCount = 0;
        state.weiCount = 0;
        state.isPaused = false;
        state.recorded = false;
        state.checkpoints = { third: false, half: false, twoThirds: false };

        dom.timerTaskName.textContent = state.taskName;
        showScreen('timer');
        updateDisplay();
        updateFlower();
        dom.timeDisplay.classList.add('running');
        state.timerInterval = setInterval(tick, 1000);
    }

    // --- Tick ---
    function tick() {
        if (state.isPaused) return;
        state.elapsedSeconds++;
        state.remainingSeconds--;

        if (state.remainingSeconds <= 0) {
            state.remainingSeconds = 0;
            completeTimer();
            return;
        }
        updateDisplay();
        checkCheckpoints();
    }

    // --- Checkpoints ---
    function checkCheckpoints() {
        var orig = state.originalDuration;
        var elapsed = state.elapsedSeconds;
        var thirdMark = Math.floor(orig / 3);
        var halfMark = Math.floor(orig / 2);
        var twoThirdsMark = Math.floor(orig * 2 / 3);

        if (!state.checkpoints.third && elapsed >= thirdMark) {
            state.checkpoints.third = true;
            showCheckpointModal(elapsed);
        } else if (!state.checkpoints.half && elapsed >= halfMark) {
            state.checkpoints.half = true;
            showCheckpointModal(elapsed);
        } else if (!state.checkpoints.twoThirds && elapsed >= twoThirdsMark) {
            state.checkpoints.twoThirds = true;
            showCheckpointModal(elapsed);
        }
    }

    function showCheckpointModal(elapsedSeconds) {
        state.isPaused = true;
        dom.modalText.textContent = '你已经专注' + formatElapsedTime(elapsedSeconds) + '，还顶得住吗？！';
        dom.modal.classList.remove('hidden');
        playDingSound();
    }

    // --- Ding ---
    function handleDing() {
        state.dingCount++;
        state.remainingSeconds -= 180;
        if (state.remainingSeconds <= 0) {
            state.remainingSeconds = 0;
            closeModal();
            updateDisplay();
            completeTimer();
            return;
        }
        closeModal();
        updateDisplay();
    }

    // --- Wei ---
    function handleWei() {
        state.weiCount++;
        if (state.weiCount > 1) {
            state.remainingSeconds += 300;
        }
        closeModal();
        updateDisplay();
        updateFlower();
    }

    function closeModal() {
        dom.modal.classList.add('hidden');
        state.isPaused = false;
    }

    // --- Complete ---
    function completeTimer() {
        clearInterval(state.timerInterval);
        state.timerInterval = null;
        dom.timeDisplay.classList.remove('running');
        playCompletionSound();

        // Save record
        if (!state.recorded) {
            saveRecord(true);
            state.recorded = true;
        }

        dom.finalDuration.textContent = Math.round(state.elapsedSeconds / 60);
        dom.finalDing.textContent = state.dingCount;
        dom.finalWei.textContent = state.weiCount;
        showScreen('completion');
    }

    // --- Reset ---
    function resetToSetup(fromCompletion) {
        // Save incomplete record if timer was running
        if (!fromCompletion && state.timerInterval && state.elapsedSeconds > 10 && !state.recorded) {
            saveRecord(false);
            state.recorded = true;
        }

        if (state.timerInterval) {
            clearInterval(state.timerInterval);
            state.timerInterval = null;
        }
        dom.timeDisplay.classList.remove('running');
        dom.flower.classList.remove('wilted');

        // Reset setup to phase 1
        dom.setupPhase1.style.display = '';
        dom.setupPhase2.classList.add('hidden');

        showScreen('setup');
    }

    // --- Show Screen ---
    function showScreen(name) {
        dom.setupScreen.classList.add('hidden');
        dom.timerScreen.classList.add('hidden');
        dom.completionScreen.classList.add('hidden');
        dom.modal.classList.add('hidden');

        switch (name) {
            case 'setup': dom.setupScreen.classList.remove('hidden'); break;
            case 'timer': dom.timerScreen.classList.remove('hidden'); break;
            case 'completion': dom.completionScreen.classList.remove('hidden'); break;
        }
    }

    // --- Update Display ---
    function updateDisplay() {
        dom.timeDisplay.textContent = formatMMSS(state.remainingSeconds);
        dom.dingCount.textContent = state.dingCount;
        dom.weiCount.textContent = state.weiCount;
    }

    function updateFlower() {
        if (state.weiCount > 1) {
            dom.flower.classList.add('wilted');
        } else {
            dom.flower.classList.remove('wilted');
        }
    }

    // --- Format ---
    function formatMMSS(totalSeconds) {
        var mins = Math.floor(totalSeconds / 60);
        var secs = totalSeconds % 60;
        return String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
    }

    function formatElapsedTime(totalSeconds) {
        var mins = Math.floor(totalSeconds / 60);
        var secs = totalSeconds % 60;
        if (mins === 0) return secs + '秒';
        if (secs === 0) return mins + '分钟';
        return mins + '分' + secs + '秒';
    }

    // --- Records / localStorage ---
    function saveRecord(completed) {
        var records = JSON.parse(localStorage.getItem('dingding-records') || '[]');
        var t = state.startTime || new Date();

        records.push({
            year: t.getFullYear(),
            month: t.getMonth() + 1,
            day: t.getDate(),
            hour: t.getHours(),
            durationMinutes: state.durationMinutes,
            elapsedMinutes: Math.round(state.elapsedSeconds / 60),
            name: state.taskName,
            ding: state.dingCount,
            wei: state.weiCount,
            completed: completed
        });

        localStorage.setItem('dingding-records', JSON.stringify(records));
    }

    function getQualityText(record) {
        if (!record.completed) return '拉完了';
        var diff = record.ding - record.wei;
        if (diff > 0) return '夯得一批';
        if (diff === 0) return '平庸的';
        return '拉完了';
    }

    function getQualityClass(record) {
        if (!record.completed) return 'quality-low';
        var diff = record.ding - record.wei;
        if (diff > 0) return 'quality-high';
        if (diff === 0) return 'quality-mid';
        return 'quality-low';
    }

    function renderNotebook() {
        var records = JSON.parse(localStorage.getItem('dingding-records') || '[]');

        if (records.length === 0) {
            dom.recordsList.innerHTML = '';
            dom.emptyState.classList.remove('hidden');
            dom.clearRecordsBtn.classList.add('hidden');
            dom.notebookSubtitle.textContent = '';
            return;
        }

        dom.emptyState.classList.add('hidden');
        dom.clearRecordsBtn.classList.remove('hidden');
        dom.notebookSubtitle.textContent = '共 ' + records.length + ' 条记录';

        dom.recordsList.innerHTML = records.slice().reverse().map(function (record) {
            var timeStr = formatRecordTime(record);
            var dur = record.durationMinutes || '?';
            var text;

            if (!record.completed) {
                var elapsed = record.elapsedMinutes || '?';
                text = timeStr + '，你进行了' + dur + '分钟的"' + record.name + '"的专注任务，' +
                    '然而在' + elapsed + '分钟的时候，你就萎了，你放弃了任务，' +
                    '做了一次<span class="quality-low">窝囊废</span>';
            } else {
                var qt = getQualityText(record);
                var qc = getQualityClass(record);
                text = timeStr + '，你进行了' + dur + '分钟的"' + record.name + '"的专注任务，' +
                    '过程中你顶了' + record.ding + '次，萎了' + record.wei + '次，' +
                    '你进入了<span class="' + qc + '">' + qt + '</span>的心流';
            }

            return '<div class="record-entry glass-card">' +
                '<p class="record-text">' + text + '</p>' +
                '</div>';
        }).join('');
    }

    function formatRecordTime(record) {
        // New format: "2026年下午2点"
        if (record.year) {
            var h = record.hour;
            var period = h < 12 ? '上午' : '下午';
            var displayHour = h % 12;
            if (displayHour === 0) displayHour = 12;
            return record.year + '年' + period + displayHour + '点';
        }
        // Backward compat for old records with date field
        return record.date || '未知时间';
    }

    // --- Sounds ---
    function playDingSound() {
        try {
            var ctx = new (window.AudioContext || window.webkitAudioContext)();
            var o1 = ctx.createOscillator(), g1 = ctx.createGain();
            o1.connect(g1); g1.connect(ctx.destination);
            o1.frequency.value = 880; o1.type = 'sine';
            g1.gain.setValueAtTime(0.3, ctx.currentTime);
            g1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
            o1.start(ctx.currentTime); o1.stop(ctx.currentTime + 0.4);

            var o2 = ctx.createOscillator(), g2 = ctx.createGain();
            o2.connect(g2); g2.connect(ctx.destination);
            o2.frequency.value = 1100; o2.type = 'sine';
            g2.gain.setValueAtTime(0.3, ctx.currentTime + 0.25);
            g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.65);
            o2.start(ctx.currentTime + 0.25); o2.stop(ctx.currentTime + 0.65);
            setTimeout(function () { ctx.close(); }, 1000);
        } catch (e) {}
    }

    function playCompletionSound() {
        try {
            var ctx = new (window.AudioContext || window.webkitAudioContext)();
            [523, 659, 784, 1047].forEach(function (freq, i) {
                var o = ctx.createOscillator(), g = ctx.createGain();
                o.connect(g); g.connect(ctx.destination);
                o.frequency.value = freq; o.type = 'sine';
                var t = ctx.currentTime + i * 0.15;
                g.gain.setValueAtTime(0.25, t);
                g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
                o.start(t); o.stop(t + 0.5);
            });
            setTimeout(function () { ctx.close(); }, 2000);
        } catch (e) {}
    }

    // --- Boot ---
    init();
})();
    </script>
</body>
