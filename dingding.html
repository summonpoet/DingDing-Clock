<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DingDing 番茄钟</title>
    <style>
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 70%, #1a1a2e 100%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    color: #fff;
}

/* --- Background Blobs --- */
.bg-blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.4;
    z-index: 0;
    pointer-events: none;
}
.blob-1 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, #e94560, #c62a7a);
    top: -100px; left: -100px;
    animation: float-1 18s ease-in-out infinite;
}
.blob-2 {
    width: 350px; height: 350px;
    background: radial-gradient(circle, #533483, #7952b3);
    bottom: -80px; right: -80px;
    animation: float-2 22s ease-in-out infinite;
}
.blob-3 {
    width: 300px; height: 300px;
    background: radial-gradient(circle, #0f3460, #1687a7);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    animation: float-3 20s ease-in-out infinite;
}
@keyframes float-1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(80px, 60px) scale(1.1); }
    66% { transform: translate(-40px, 100px) scale(0.95); }
}
@keyframes float-2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(-60px, -80px) scale(1.15); }
    66% { transform: translate(50px, -40px) scale(0.9); }
}
@keyframes float-3 {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    33% { transform: translate(-40%, -60%) scale(1.1); }
    66% { transform: translate(-60%, -40%) scale(0.95); }
}

/* --- Glass Card --- */
.glass-card {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1);
}

/* --- Screen Basics --- */
.screen {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: fadeIn 0.5s ease;
}
.screen.hidden { display: none; }
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* --- Focus Tab (app-container) --- */
.app-container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    padding-bottom: 80px;
}

/* --- Notebook Tab --- */
.notebook-container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    padding: 40px 20px 80px;
    overflow-y: auto;
}
.notebook-container.hidden { display: none; }

.notebook-title {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #FFB3BA, #FFC3A0, #FFE082);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-align: center;
}
.notebook-subtitle {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.4);
    text-align: center;
    margin-bottom: 28px;
}
.records-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.record-entry {
    padding: 18px 20px;
}
.record-text {
    font-size: 14px;
    line-height: 1.9;
    color: rgba(255, 255, 255, 0.8);
}
.quality-high {
    color: #66BB6A;
    font-weight: 700;
}
.quality-mid {
    color: #FFB300;
    font-weight: 700;
}
.quality-low {
    color: #EF5350;
    font-weight: 700;
}
.quality-flow {
    color: #CE93D8;
    font-weight: 700;
}
.empty-state {
    text-align: center;
    padding: 60px 20px;
    color: rgba(255, 255, 255, 0.3);
    font-size: 15px;
}
.empty-state.hidden { display: none; }
.clear-records-btn {
    display: block;
    margin: 24px auto 0;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    color: rgba(255, 255, 255, 0.3);
    font-size: 12px;
    padding: 8px 16px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.3s ease;
}
.clear-records-btn:hover {
    border-color: rgba(239, 83, 80, 0.4);
    color: rgba(239, 83, 80, 0.7);
}
.clear-records-btn.hidden { display: none; }

/* --- Tab Bar --- */
.tab-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    background: rgba(15, 15, 30, 0.88);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    padding: 10px 20px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    z-index: 80;
    gap: 8px;
}
.tab-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: rgba(255, 255, 255, 0.35);
    font-size: 14px;
    font-weight: 600;
    padding: 10px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
}
.tab-btn.active {
    background: rgba(255, 255, 255, 0.1);
    color: rgba(255, 255, 255, 0.9);
}
.tab-btn:hover:not(.active) {
    color: rgba(255, 255, 255, 0.55);
}

/* --- Setup Screen --- */
.setup-card {
    padding: 48px 36px;
    text-align: center;
    width: 100%;
}
.app-title {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #FFB3BA, #FFC3A0, #FFE082);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.subtitle {
    font-size: 16px;
    color: rgba(255, 255, 255, 0.6);
    margin-bottom: 36px;
}

/* Phase 1 */
.start-btn {
    font-size: 20px;
    font-weight: 700;
    padding: 22px 40px;
    background: linear-gradient(135deg, rgba(255, 179, 186, 0.2), rgba(255, 195, 160, 0.2));
    border-color: rgba(255, 179, 186, 0.3);
    font-family: inherit;
    letter-spacing: 2px;
}
.start-btn:hover {
    background: linear-gradient(135deg, rgba(255, 179, 186, 0.3), rgba(255, 195, 160, 0.3));
    border-color: rgba(255, 179, 186, 0.5);
}

/* Phase 2 */
#setup-phase2 {
    animation: fadeIn 0.4s ease;
}
#setup-phase2.hidden { display: none; }

.task-input {
    width: 100%;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px;
    padding: 16px 20px;
    color: #fff;
    font-size: 16px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.3s ease;
    margin-bottom: 28px;
    text-align: center;
}
.task-input:focus {
    border-color: rgba(255, 255, 255, 0.3);
}
.task-input::placeholder {
    color: rgba(255, 255, 255, 0.3);
}
.time-label {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.45);
    margin-bottom: 16px;
}
.time-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

/* --- Glass Buttons --- */
.glass-btn {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    color: #fff;
    font-size: 18px;
    font-weight: 600;
    padding: 18px 24px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
}
.glass-btn:hover {
    background: rgba(255, 255, 255, 0.18);
    border-color: rgba(255, 255, 255, 0.3);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
}
.glass-btn:active {
    transform: translateY(0);
    background: rgba(255, 255, 255, 0.22);
}
.time-btn { font-family: inherit; }

/* --- Timer Screen --- */
#timer-screen {
    justify-content: flex-start;
    padding-top: 8vh;
    min-height: 100vh;
}
.timer-task-name {
    font-size: 18px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.7);
    margin-bottom: 20px;
    padding: 8px 20px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
}
.stats-bar {
    display: flex;
    gap: 12px;
    width: 100%;
    margin-bottom: 32px;
}
.stat-item {
    flex: 1;
    padding: 16px 12px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.stat-label {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.5);
    letter-spacing: 1px;
    text-transform: uppercase;
}
.stat-value {
    font-size: 24px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
}
.time-value {
    font-size: 28px;
    background: linear-gradient(135deg, #FFE082, #FFB300);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.count-value { color: rgba(255, 255, 255, 0.9); }

/* --- Flower --- */
.flower-container {
    display: flex;
    justify-content: center;
    align-items: center;
    flex: 1;
    min-height: 350px;
    margin-bottom: 24px;
}
.flower { transition: filter 1.2s ease; }
.flower .flower-head { transform-origin: 100px 160px; transition: transform 1.2s ease; }
.flower .leaf { transition: transform 1s ease, fill 1.2s ease; }
.flower .leaf-vein { transition: stroke 1.2s ease; }
.flower .stem { transition: stroke 1.2s ease; }
.flower:not(.wilted) .flower-head { animation: gentle-sway 4s ease-in-out infinite; }
@keyframes gentle-sway {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(2deg); }
    75% { transform: rotate(-2deg); }
}
.flower.wilted { filter: saturate(0.15) brightness(0.65) sepia(0.5); }
.flower.wilted .flower-head { transform: rotate(45deg); animation: none; }
.flower.wilted .left-leaf { transform-origin: 100px 215px; transform: rotate(15deg) translateY(8px); }
.flower.wilted .right-leaf { transform-origin: 100px 252px; transform: rotate(-15deg) translateY(8px); }

/* --- Controls --- */
.controls {
    width: 100%;
    display: flex;
    justify-content: center;
    padding-bottom: 40px;
}
.control-btn { font-family: inherit; min-width: 160px; }

/* --- Abandon Button --- */
.abandon-btn {
    background: rgba(239, 83, 80, 0.08);
    border-color: rgba(239, 83, 80, 0.2);
    color: rgba(255, 255, 255, 0.5);
    font-size: 15px;
    padding: 14px 24px;
}
.abandon-btn:hover {
    background: rgba(239, 83, 80, 0.18);
    border-color: rgba(239, 83, 80, 0.35);
    color: rgba(255, 255, 255, 0.75);
}
.abandon-btn:active {
    background: rgba(239, 83, 80, 0.25);
}

/* --- Modal --- */
.modal {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    animation: fadeIn 0.3s ease;
}
.modal.hidden { display: none; }
.modal-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}
.modal-content {
    position: relative;
    z-index: 1;
    padding: 40px 32px;
    text-align: center;
    max-width: 380px;
    width: 90%;
    animation: modal-pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes modal-pop {
    from { opacity: 0; transform: scale(0.8) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-text {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.6;
    margin-bottom: 32px;
    color: rgba(255, 255, 255, 0.95);
}
.modal-buttons {
    display: flex;
    gap: 16px;
    justify-content: center;
}
.modal-btn {
    flex: 1;
    padding: 16px 24px;
    border-radius: 16px;
    border: none;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
}
.ding-btn {
    background: linear-gradient(135deg, #66BB6A, #43A047);
    color: #fff;
    box-shadow: 0 4px 16px rgba(76, 175, 80, 0.3);
}
.ding-btn:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 6px 24px rgba(76, 175, 80, 0.4); }
.ding-btn:active { transform: translateY(0) scale(0.98); }
.wei-btn {
    background: linear-gradient(135deg, #78909C, #546E7A);
    color: #fff;
    box-shadow: 0 4px 16px rgba(84, 110, 122, 0.3);
}
.wei-btn:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 6px 24px rgba(84, 110, 122, 0.4); }
.wei-btn:active { transform: translateY(0) scale(0.98); }

/* --- Completion Screen --- */
#completion-screen {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 50;
    justify-content: center;
    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}
.completion-card {
    padding: 48px 36px;
    text-align: center;
    max-width: 400px;
    width: 90%;
    animation: modal-pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.completion-title {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #FFE082, #FFB300);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.completion-subtitle {
    font-size: 16px;
    color: rgba(255, 255, 255, 0.6);
    margin-bottom: 32px;
}
.completion-stats {
    display: flex;
    gap: 16px;
    margin-bottom: 32px;
}
.completion-stat {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.completion-stat-value {
    font-size: 28px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.95);
}
.completion-stat-label {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.45);
    letter-spacing: 0.5px;
}

@keyframes timer-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
}
.time-value.running { animation: timer-pulse 2s ease-in-out infinite; }

/* --- Responsive --- */
@media (max-width: 400px) {
    .app-container { padding: 12px; padding-bottom: 80px; }
    .setup-card { padding: 36px 24px; }
    .app-title { font-size: 26px; }
    .stats-bar { gap: 8px; }
    .stat-item { padding: 12px 8px; }
    .stat-value { font-size: 20px; }
    .time-value { font-size: 22px; }
    .stat-label { font-size: 10px; }
    .modal-content { padding: 28px 20px; }
    .modal-text { font-size: 17px; }
    .modal-btn { font-size: 18px; padding: 14px 18px; }
    .start-btn { font-size: 18px; padding: 18px 32px; }
}
@media (max-height: 700px) {
    #timer-screen { padding-top: 4vh; }
    .flower-container { min-height: 280px; }
    .flower-container svg { width: 180px; height: 280px; }
}

/* ============================================
   Garden System - Pixel Art Style
   ============================================ */

/* --- Pixel Font Rendering --- */
.garden-container *, .garden-toast {
    image-rendering: pixelated;
}

/* --- Garden Container --- */
.garden-container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    padding: 32px 16px 80px;
    overflow-y: auto;
}
.garden-container.hidden { display: none; }

.garden-title {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 4px;
    background: linear-gradient(135deg, #FFE082, #81C784, #FFB300);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-align: center;
    letter-spacing: 2px;
}
.garden-subtitle {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.35);
    text-align: center;
    margin-bottom: 20px;
}

/* --- Garden Sections --- */
.garden-section {
    margin-bottom: 20px;
}
.garden-section-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    padding: 0 4px;
}
.garden-section-icon {
    font-size: 18px;
}
.garden-section-label {
    font-size: 15px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.8);
    letter-spacing: 1px;
}
.garden-section-count {
    margin-left: auto;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.35);
    font-variant-numeric: tabular-nums;
}

/* --- Grid (shared for garden & storage) --- */
.garden-grid, .storage-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
}

/* --- Pixel Slot --- */
.pixel-slot {
    aspect-ratio: 1;
    border: 2px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.04);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
    padding: 2px;
}
.pixel-slot:hover {
    border-color: rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.08);
}
.pixel-slot.selected {
    border-color: rgba(255, 224, 130, 0.6);
    background: rgba(255, 224, 130, 0.1);
    box-shadow: 0 0 12px rgba(255, 224, 130, 0.15);
}
.pixel-slot.empty {
    cursor: default;
    opacity: 0.5;
}
.pixel-slot.empty:hover {
    border-color: rgba(255, 255, 255, 0.08);
    background: rgba(255, 255, 255, 0.04);
}

/* Garden soil plot */
.garden-grid .pixel-slot {
    background: rgba(101, 67, 33, 0.25);
    border-color: rgba(139, 90, 43, 0.3);
}
.garden-grid .pixel-slot:hover {
    background: rgba(101, 67, 33, 0.35);
    border-color: rgba(139, 90, 43, 0.5);
}
.garden-grid .pixel-slot.selected {
    border-color: rgba(255, 224, 130, 0.6);
    background: rgba(101, 67, 33, 0.35);
}
.garden-grid .pixel-slot.watered {
    background: rgba(60, 80, 50, 0.35);
    border-color: rgba(100, 180, 100, 0.25);
}

/* --- Pixel Sprite (the item image) --- */
.pixel-sprite {
    width: 32px;
    height: 32px;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
}

/* --- Item Count Badge --- */
.item-count-badge {
    position: absolute;
    bottom: 2px;
    right: 3px;
    font-size: 10px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.85);
    background: rgba(0, 0, 0, 0.5);
    border-radius: 4px;
    padding: 0px 4px;
    min-width: 16px;
    text-align: center;
    line-height: 16px;
}

/* --- Item Name Label --- */
.item-name-label {
    font-size: 8px;
    color: rgba(255, 255, 255, 0.5);
    margin-top: 1px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    line-height: 1.2;
}

/* --- Watered indicator --- */
.watered-indicator {
    position: absolute;
    top: 2px;
    left: 3px;
    font-size: 10px;
    line-height: 1;
}

/* --- Garden Action Info Panel --- */
.garden-actions {
    min-height: 60px;
}
.garden-action-info {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 14px 16px;
    text-align: center;
}
.garden-action-info.hidden { display: none; }

.garden-action-title {
    font-size: 15px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.85);
    margin-bottom: 4px;
}
.garden-action-desc {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.45);
    margin-bottom: 10px;
    line-height: 1.5;
}
.garden-action-btns {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
}
.garden-act-btn {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    padding: 8px 14px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
}
.garden-act-btn:hover {

/* --- Flow State Button in Modal --- */
.flow-btn {

/* --- Modal buttons wrap for 3 buttons --- */
.modal-buttons {
    flex-wrap: wrap;
}

/* --- Flow Mode Visual Overrides --- */
body.flow-mode {
    background: linear-gradient(135deg, #1a0033 0%, #2d1b69 25%, #0d3b66 50%, #1b5e20 75%, #4a148c 100%);
    animation: flow-bg-shift 8s ease-in-out infinite;
}
@keyframes flow-bg-shift {
    0%, 100% { background: linear-gradient(135deg, #1a0033, #2d1b69, #0d3b66, #1b5e20, #4a148c); }
    25% { background: linear-gradient(135deg, #4a148c, #880e4f, #e65100, #1a237e, #006064); }
    50% { background: linear-gradient(135deg, #006064, #1b5e20, #4a148c, #880e4f, #1a0033); }
    75% { background: linear-gradient(135deg, #880e4f, #1a237e, #1b5e20, #e65100, #2d1b69); }
}

body.flow-mode .bg-blob {
    opacity: 0.6;
    animation-duration: 6s;
}
body.flow-mode .blob-1 {
    background: radial-gradient(circle, #e040fb, #aa00ff);
}
body.flow-mode .blob-2 {
    background: radial-gradient(circle, #00e5ff, #2979ff);
}
body.flow-mode .blob-3 {
    background: radial-gradient(circle, #76ff03, #00c853);
}

body.flow-mode .time-value {
    background: linear-gradient(135deg, #CE93D8, #E040FB, #AA00FF);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

/* --- Mushroom container --- */
.mushroom-container {

}

}
body.flow-mode .flower-container > svg {

}

.mushroom-svg {

    filter: drop-shadow(0 0 20px rgba(224, 64, 251, 0.4));
}
@keyframes mushroom-float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-8px) rotate(2deg); }
    50% { transform: translateY(-4px) rotate(0deg); }
    75% { transform: translateY(-10px) rotate(-2deg); }
}

/* --- Particle Canvas --- */
.flow-particles {

    <script>
(function () {
    'use strict';

    // --- State ---
    var state = {
        taskName: '',
        originalDuration: 0,
        durationMinutes: 0,
        remainingSeconds: 0,
        elapsedSeconds: 0,
        dingCount: 0,
        weiCount: 0,
        timerInterval: null,
        isPaused: false,
        recorded: false,
        startTime: null,
        checkpoints: { third: false, half: false, twoThirds: false },
        // Wall-clock tracking
        timerStartTs: 0,     // Date.now() when timer started
        deadlineTs: 0,       // Date.now() when timer should end
        pausedAt: 0,         // Date.now() when paused (checkpoint modal)
        totalPausedMs: 0,    // accumulated pause time in ms
        // Flow state
        isFlowMode: false,
        flowStartTs: 0,      // Date.now() when flow mode started
        flowSeconds: 0,
        flowAnimFrame: null
    };

    // --- DOM ---
    var dom = {
        focusTab: document.getElementById('focus-tab'),
        notebookTab: document.getElementById('notebook-tab'),
        tabBtns: document.querySelectorAll('.tab-btn'),
        // View switcher & Planner
        viewSwitcher: document.getElementById('view-switcher'),
        viewBtns: document.querySelectorAll('.view-btn'),
        plannerView: document.getElementById('planner-view'),
        plannerTaskName: document.getElementById('planner-task-name'),
        plannerTotalHours: document.getElementById('planner-total-hours'),
        plannerAddBtn: document.getElementById('planner-add-btn'),
        plannerList: document.getElementById('planner-list'),
        plannerEmpty: document.getElementById('planner-empty'),
        plannerTaskBanner: document.getElementById('planner-task-banner'),
        plannerBannerName: document.getElementById('planner-banner-name'),
        plannerBannerProgress: document.getElementById('planner-banner-progress'),
        timerPlannerInfo: document.getElementById('timer-planner-info'),
        setupScreen: document.getElementById('setup-screen'),
        timerScreen: document.getElementById('timer-screen'),
        completionScreen: document.getElementById('completion-screen'),
        modal: document.getElementById('modal'),
        modalText: document.getElementById('modal-text'),
        setupPhase1: document.getElementById('setup-phase1'),
        setupPhase2: document.getElementById('setup-phase2'),
        startFlowBtn: document.getElementById('start-flow-btn'),
        taskNameInput: document.getElementById('task-name-input'),
        timerTaskName: document.getElementById('timer-task-name'),
        timeDisplay: document.getElementById('time-display'),
        dingCount: document.getElementById('ding-count'),
        weiCount: document.getElementById('wei-count'),
        flower: document.getElementById('flower-svg'),
        dingBtn: document.getElementById('ding-btn'),
        weiBtn: document.getElementById('wei-btn'),
        flowBtn: document.getElementById('flow-btn'),
        flowParticles: document.getElementById('flow-particles'),
        mushroomContainer: document.getElementById('mushroom-container'),
        resetBtn: document.getElementById('reset-btn'),
        restartBtn: document.getElementById('restart-btn'),
        finalDuration: document.getElementById('final-duration'),
        finalDing: document.getElementById('final-ding'),
        finalWei: document.getElementById('final-wei'),
        timeBtns: document.querySelectorAll('.time-btn'),
        recordsList: document.getElementById('records-list'),
        emptyState: document.getElementById('empty-state'),
        notebookSubtitle: document.getElementById('notebook-subtitle'),
        clearRecordsBtn: document.getElementById('clear-records-btn'),
        // Garden
        gardenTab: document.getElementById('garden-tab'),
        gardenGrid: document.getElementById('garden-grid'),
        storageGrid: document.getElementById('storage-grid'),
        gardenCount: document.getElementById('garden-count'),
        storageCount: document.getElementById('storage-count'),
        gardenActionInfo: document.getElementById('garden-action-info'),
        gardenToast: document.getElementById('garden-toast')
    };

    // ============================================
    // Overall Planner Module
    // ============================================
    var Planner = (function () {
        var STORAGE_KEY = 'dingding-planner';
        var ARCHIVE_KEY = 'dingding-planner-archive';

        function loadTasks() {
            var raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return [];
            try { return JSON.parse(raw); } catch (e) { return []; }
        }

        function loadArchivedTasks() {
            var raw = localStorage.getItem(ARCHIVE_KEY);
            if (!raw) return [];
            try { return JSON.parse(raw); } catch (e) { return []; }
        }

        function saveTasks(tasks) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        }

        function saveArchivedTasks(tasks) {
            localStorage.setItem(ARCHIVE_KEY, JSON.stringify(tasks));
        }

        function generateId() {
            return 'p_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        function addTask(name, totalHours) {
            var tasks = loadTasks();
            tasks.push({
                id: generateId(),
                name: name,
                totalHours: totalHours,
                completedHours: 0,
                createdAt: new Date().toISOString()
            });
            saveTasks(tasks);
            return tasks;
        }

        function deleteTask(id) {
            var tasks = loadTasks();
            tasks = tasks.filter(function (t) { return t.id !== id; });
            saveTasks(tasks);
            return tasks;
        }

        function archiveTask(id) {
            var tasks = loadTasks();
            var task = tasks.find(function (t) { return t.id === id; });
            if (!task) return null;

            // Remove from active tasks
            tasks = tasks.filter(function (t) { return t.id !== id; });
            saveTasks(tasks);

            // Add to archived tasks with archive timestamp
            var archived = loadArchivedTasks();
            task.archivedAt = new Date().toISOString();
            archived.unshift(task); // Add to beginning (newest first)
            saveArchivedTasks(archived);

            return { active: tasks, archived: archived };
        }

        function updateProgress(id, hours) {
            var tasks = loadTasks();
            var task = tasks.find(function (t) { return t.id === id; });
            if (task) {
                task.completedHours = Math.min(task.completedHours + hours, task.totalHours);
                saveTasks(tasks);

                // Auto-archive if 100% complete
                if (task.completedHours >= task.totalHours) {
                    return archiveTask(id);
                }
            }
            return { active: tasks, archived: loadArchivedTasks() };
        }

        function getTask(id) {
            var tasks = loadTasks();
            return tasks.find(function (t) { return t.id === id; });
        }

        function getProgressPercent(task) {
            return Math.round((task.completedHours / task.totalHours) * 100);
        }

        return {
            loadTasks: loadTasks,
            loadArchivedTasks: loadArchivedTasks,
            addTask: addTask,
            deleteTask: deleteTask,
            archiveTask: archiveTask,
            updateProgress: updateProgress,
            getTask: getTask,
            getProgressPercent: getProgressPercent
        };
    })();

    // --- Planner UI Functions ---
    var currentPlannerId = '';

    function initPlanner() {
        // View switcher
        dom.viewBtns.forEach(function (btn) {
            btn.addEventListener('click', function () {
                switchView(this.dataset.view);
            });
        });

        // Add task button
        dom.plannerAddBtn.addEventListener('click', function () {
            var name = dom.plannerTaskName.value.trim();
            var hours = parseFloat(dom.plannerTotalHours.value);

            if (!name) {
                alert('请输入任务名称');
                return;
            }
            if (isNaN(hours) || hours <= 0) {
                alert('请输入有效的时间');
                return;
            }

            Planner.addTask(name, hours);
            dom.plannerTaskName.value = '';
            renderPlanner();
        });

        // Enter key in planner inputs
        dom.plannerTaskName.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                dom.plannerTotalHours.focus();
            }
        });
        dom.plannerTotalHours.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                dom.plannerAddBtn.click();
            }
        });
    }

    function switchView(view) {
        dom.viewBtns.forEach(function (btn) {
            btn.classList.toggle('active', btn.dataset.view === view);
        });

        if (view === 'quick') {
            dom.setupScreen.classList.remove('hidden');
            dom.plannerView.classList.add('hidden');
            dom.setupScreen.dataset.fromPlanner = 'false';
            hidePlannerBanner();
        } else {
            dom.setupScreen.classList.add('hidden');
            dom.plannerView.classList.remove('hidden');
            renderPlanner();
        }
    }

    function renderPlanner() {
        var tasks = Planner.loadTasks();
        var archived = Planner.loadArchivedTasks();
        var html = '';

        // Active tasks section
        if (tasks.length === 0) {
            dom.plannerEmpty.classList.remove('hidden');
        } else {
            dom.plannerEmpty.classList.add('hidden');

            tasks.forEach(function (task) {
                var percent = Planner.getProgressPercent(task);
                var progressText = task.completedHours.toFixed(1) + ' / ' + task.totalHours + ' 小时';

                html += '<div class="planner-item glass-card" data-id="' + task.id + '">';
                html += '<div class="planner-item-header">';
                html += '<span class="planner-item-name">' + escapeHtml(task.name) + '</span>';
                html += '<button class="planner-item-delete" data-delete="' + task.id + '">删除</button>';
                html += '</div>';
                html += '<div class="planner-progress-section">';
                html += '<div class="planner-progress-bar-bg">';
                html += '<div class="planner-progress-bar" style="width: ' + Math.min(percent, 100) + '%"></div>';
                html += '</div>';
                html += '<div class="planner-progress-text">';
                html += '<span>' + progressText + '</span>';
                html += '<span class="planner-progress-percent">' + percent + '%</span>';
                html += '</div>';
                html += '</div>';
                html += '<div class="planner-item-actions">';
                html += '<button class="glass-btn planner-start-btn" data-start="' + task.id + '">开始该任务</button>';
                html += '<button class="glass-btn planner-done-btn" data-done="' + task.id + '">✓ 标记为已完成</button>';
                html += '</div>';
                html += '</div>';
            });
        }

        // Archived tasks section
        if (archived.length > 0) {
            html += '<div class="planner-archive-section">';
            html += '<div class="planner-archive-header">';
            html += '<span class="planner-archive-title">📦 已归档</span>';
            html += '<span class="planner-archive-count">' + archived.length + ' 个任务</span>';
            html += '</div>';
            html += '<div class="planner-archive-list">';

            archived.forEach(function (task) {
                var archiveDate = task.archivedAt ? new Date(task.archivedAt).toLocaleDateString('zh-CN') : '未知时间';
                html += '<div class="planner-archive-item glass-card">';
                html += '<div class="planner-archive-item-info">';
                html += '<span class="planner-archive-item-name">' + escapeHtml(task.name) + '</span>';
                html += '<span class="planner-archive-item-meta">' + task.totalHours + '小时 | 完成于 ' + archiveDate + '</span>';
                html += '</div>';
                html += '<span class="planner-archive-item-check">✓</span>';
                html += '</div>';
            });

            html += '</div></div>';
        }

        dom.plannerList.innerHTML = html;

        // Bind delete buttons
        dom.plannerList.querySelectorAll('.planner-item-delete').forEach(function (btn) {
            btn.addEventListener('click', function (e) {
                e.stopPropagation();
                if (confirm('确定要删除这个任务吗？')) {
                    Planner.deleteTask(this.dataset.delete);
                    renderPlanner();
                }
            });
        });

        // Bind start buttons
        dom.plannerList.querySelectorAll('.planner-start-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var id = this.dataset.start;
                startPlannerTask(id);
            });
        });

        // Bind done buttons
        dom.plannerList.querySelectorAll('.planner-done-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var id = this.dataset.done;
                if (confirm('确定要标记这个任务为已完成吗？它将移至已归档。')) {
                    Planner.archiveTask(id);
                    renderPlanner();
                }
            });
        });
    }

    function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function startPlannerTask(id) {
        var task = Planner.getTask(id);
        if (!task) return;

        // Check if already completed
        if (Planner.getProgressPercent(task) >= 100) {
            alert('该任务已完成！');
            return;
        }

        currentPlannerId = id;

        // Switch to quick view with planner context
        switchView('quick');
        dom.setupScreen.dataset.fromPlanner = 'true';

        // Show banner
        showPlannerBanner(task);

        // Skip Phase 1 and go directly to Phase 2 (task is already determined)
        dom.setupPhase1.style.display = 'none';
        dom.setupPhase2.classList.remove('hidden');

        // Pre-fill task name and focus on time selection
        dom.taskNameInput.value = task.name;
        dom.timeBtns[0].focus();
    }

    function showPlannerBanner(task) {
        var percent = Planner.getProgressPercent(task);
        dom.plannerBannerName.textContent = task.name;
        dom.plannerBannerProgress.textContent = '（已完成 ' + percent + '%）';
        dom.plannerTaskBanner.classList.remove('hidden');
    }

    function hidePlannerBanner() {
        dom.plannerTaskBanner.classList.add('hidden');
        currentPlannerId = '';
    }

    function updatePlannerProgress(hours) {
        if (!currentPlannerId) return;
        var result = Planner.updateProgress(currentPlannerId, hours);
        // If task was auto-archived (reached 100%), clear currentPlannerId
        if (result && result.active && !result.active.find(function (t) { return t.id === currentPlannerId; })) {
            currentPlannerId = '';
        }
    }

    // --- Init ---
    function init() {
        // "当个事儿办" button -> show phase 2
        dom.startFlowBtn.addEventListener('click', function () {
            dom.setupPhase1.style.display = 'none';
            dom.setupPhase2.classList.remove('hidden');
            dom.taskNameInput.value = '';
            dom.taskNameInput.focus();
        });

        // Time selection
        dom.timeBtns.forEach(function (btn) {
            btn.addEventListener('click', function () {
                startTimer(parseInt(this.dataset.minutes, 10));
            });
        });

        // Checkpoint modal buttons
        dom.dingBtn.addEventListener('click', handleDing);
        dom.weiBtn.addEventListener('click', handleWei);
        dom.flowBtn.addEventListener('click', handleFlow);

        // Reset / Restart
        dom.resetBtn.addEventListener('click', function () {
            resetToSetup(false);
        });
        dom.restartBtn.addEventListener('click', function () {
            resetToSetup(true);
        });

        // Tab switching
        dom.tabBtns.forEach(function (btn) {
            btn.addEventListener('click', function () {
                switchTab(this.dataset.tab);
            });
        });

        // Clear records
        dom.clearRecordsBtn.addEventListener('click', function () {
            if (confirm('确定要清空所有记录吗？')) {
                localStorage.removeItem('dingding-records');
                renderNotebook();
            }
        });

        // Init Planner
        initPlanner();

        // Visibility change: sync timer immediately when tab becomes visible
        document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible' && state.timerInterval) {
                if (state.isFlowMode) {
                    flowTick();
                } else if (!state.isPaused) {
                    tick();
                }
            }
        });

        // Enter key in name input -> focus first time button
        dom.taskNameInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                dom.timeBtns[0].focus();
            }
        });

        // Swipe gesture for tab switching
        var touchStartX = 0;
        var touchStartY = 0;
        document.addEventListener('touchstart', function (e) {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });
        var tabOrder = ['focus', 'garden', 'notebook'];
        document.addEventListener('touchend', function (e) {
            var dx = e.changedTouches[0].screenX - touchStartX;
            var dy = e.changedTouches[0].screenY - touchStartY;
            if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 1.5) {
                var current = 'focus';
                dom.tabBtns.forEach(function (btn) { if (btn.classList.contains('active')) current = btn.dataset.tab; });
                var idx = tabOrder.indexOf(current);
                if (dx < 0 && idx < tabOrder.length - 1) {
                    switchTab(tabOrder[idx + 1]);
                } else if (dx > 0 && idx > 0) {
                    switchTab(tabOrder[idx - 1]);
                }
            }
        }, { passive: true });
    }

    // --- Tab Switching ---
    function switchTab(tab) {
        dom.tabBtns.forEach(function (btn) {
            btn.classList.toggle('active', btn.dataset.tab === tab);
        });

        dom.focusTab.style.display = 'none';
        dom.notebookTab.classList.add('hidden');
        dom.gardenTab.classList.add('hidden');

        if (tab === 'focus') {
            dom.focusTab.style.display = '';
            // Reset to quick view
            dom.setupScreen.classList.remove('hidden');
            dom.plannerView.classList.add('hidden');
            dom.viewBtns.forEach(function (btn) {
                btn.classList.toggle('active', btn.dataset.view === 'quick');
            });
        } else if (tab === 'garden') {
            dom.gardenTab.classList.remove('hidden');
            Garden.checkGrowth();
            Garden.render();
        } else {
            dom.notebookTab.classList.remove('hidden');
            renderNotebook();
        }
    }

    // --- Start Timer ---
    function startTimer(minutes) {
        var nameVal = dom.taskNameInput.value.trim();
        state.taskName = nameVal || '专注';
        state.originalDuration = minutes * 60;
        state.durationMinutes = minutes;
        state.startTime = new Date();
        state.dingCount = 0;
        state.weiCount = 0;
        state.isPaused = false;
        state.recorded = false;
        state.checkpoints = { third: false, half: false, twoThirds: false };

        // Wall-clock based timing
        var now = Date.now();
        state.timerStartTs = now;
        state.deadlineTs = now + state.originalDuration * 1000;
        state.pausedAt = 0;
        state.totalPausedMs = 0;

        // Compute initial display values
        syncTimerFromClock();

        dom.timerTaskName.textContent = state.taskName;

        // Show planner info if from planner
        if (currentPlannerId) {
            var task = Planner.getTask(currentPlannerId);
            if (task) {
                var percent = Planner.getProgressPercent(task);
                dom.timerPlannerInfo.innerHTML = '📋 规划任务：' + escapeHtml(task.name) + 
                    ' | 进度：' + task.completedHours.toFixed(1) + '/' + task.totalHours + '小时 (' + percent + '%)';
                dom.timerPlannerInfo.classList.remove('hidden');
            }
            dom.timerScreen.dataset.plannerId = currentPlannerId;
        } else {
            dom.timerPlannerInfo.classList.add('hidden');
            dom.timerScreen.dataset.plannerId = '';
        }

        showScreen('timer');
        updateDisplay();
        updateFlower();
        dom.timeDisplay.classList.add('running');
        state.timerInterval = setInterval(tick, 1000);
    }

    // Sync elapsed/remaining from real wall-clock
    function syncTimerFromClock() {
        var now = Date.now();
        var effectiveNow = now;
        // If paused, don't advance past the pause point
        if (state.isPaused && state.pausedAt) {
            effectiveNow = state.pausedAt;
        }
        var elapsedMs = effectiveNow - state.timerStartTs - state.totalPausedMs;
        state.elapsedSeconds = Math.max(0, Math.floor(elapsedMs / 1000));
        var remainMs = state.deadlineTs - effectiveNow;
        state.remainingSeconds = Math.max(0, Math.ceil(remainMs / 1000));
    }

    // --- Tick ---
    function tick() {
        if (state.isPaused) return;
        syncTimerFromClock();

        if (state.remainingSeconds <= 0) {
            state.remainingSeconds = 0;
            completeTimer();
            return;
        }
        updateDisplay();
        checkCheckpoints();
    }

    // --- Checkpoints ---
    function checkCheckpoints() {
        var orig = state.originalDuration;
        var elapsed = state.elapsedSeconds;
        var thirdMark = Math.floor(orig / 3);
        var halfMark = Math.floor(orig / 2);
        var twoThirdsMark = Math.floor(orig * 2 / 3);

        if (!state.checkpoints.third && elapsed >= thirdMark) {
            state.checkpoints.third = true;
            showCheckpointModal(elapsed);
        } else if (!state.checkpoints.half && elapsed >= halfMark) {
            state.checkpoints.half = true;
            showCheckpointModal(elapsed);
        } else if (!state.checkpoints.twoThirds && elapsed >= twoThirdsMark) {
            state.checkpoints.twoThirds = true;
            showCheckpointModal(elapsed);
        }
    }

    function showCheckpointModal(elapsedSeconds) {
        state.isPaused = true;
        state.pausedAt = Date.now();
        dom.modalText.textContent = '你已经专注' + formatElapsedTime(elapsedSeconds) + '，还顶得住吗？！';
        dom.modal.classList.remove('hidden');
        playDingSound();
    }

    // --- Ding ---
    function handleDing() {
        state.dingCount++;
        // Drop: each "顶" gives 1 顶顶球
        Garden.addItem('dingding_ball', 1);
        // Shift deadline earlier by 3 minutes
        state.deadlineTs -= 180 * 1000;
        closeModal();
        syncTimerFromClock();
        if (state.remainingSeconds <= 0) {
            state.remainingSeconds = 0;
            updateDisplay();
            completeTimer();
            return;
        }
        updateDisplay();
    }

    // --- Wei ---
    function handleWei() {
        state.weiCount++;
        if (state.weiCount > 1) {
            // Shift deadline later by 5 minutes
            state.deadlineTs += 300 * 1000;
        }
        closeModal();
        syncTimerFromClock();
        updateDisplay();
        updateFlower();
    }

    function closeModal() {
        dom.modal.classList.add('hidden');
        // Accumulate pause duration and shift deadline forward
        if (state.pausedAt) {
            var pausedMs = Date.now() - state.pausedAt;
            state.totalPausedMs += pausedMs;
            state.deadlineTs += pausedMs; // push deadline by paused time
            state.pausedAt = 0;
        }
        state.isPaused = false;
    }

    // --- Flow State (思如泉涌) ---
    function handleFlow() {
        // Complete the current timer as success first
        clearInterval(state.timerInterval);
        state.timerInterval = null;
        state.remainingSeconds = 0;
        dom.timeDisplay.classList.remove('running');

        // Save the completed record (task success)
        if (!state.recorded) {
            saveRecord(true);
            state.recorded = true;
            Garden.addItem('sweet_seedling', 1);
            Garden.addItem('water_drop', 2);
        }

        // Enter flow mode
        state.isFlowMode = true;
        state.flowStartTs = Date.now();
        state.flowSeconds = 0;
        closeModal();

        // Visual changes
        document.body.classList.add('flow-mode');

        // Update stat label to show count-up
        var timeLabel = dom.timeDisplay.closest('.stat-item').querySelector('.stat-label');
        if (timeLabel) timeLabel.textContent = '泉涌时间';
        dom.timeDisplay.textContent = '00:00';
        dom.timeDisplay.classList.add('running');

        // Change button text
        dom.resetBtn.textContent = '贤者时间到';

        // Start count-up timer
        state.timerInterval = setInterval(flowTick, 1000);

        // Start particle effects
        startFlowParticles();

        playFlowSound();
    }

    function flowTick() {
        state.flowSeconds = Math.floor((Date.now() - state.flowStartTs) / 1000);
        dom.timeDisplay.textContent = formatMMSS(state.flowSeconds);
    }

    function endFlowState() {
        if (!state.isFlowMode) return;

        clearInterval(state.timerInterval);
        state.timerInterval = null;
        dom.timeDisplay.classList.remove('running');

        // Calculate flow hours for planner
        var flowHours = state.flowSeconds / 3600;

        // Stop particles
        stopFlowParticles();

        // Remove flow mode visuals
        document.body.classList.remove('flow-mode');

        // Reward: 1 迷幻蘑菇
        Garden.addItem('psychedelic_mushroom', 1);

        // Update planner progress for flow time
        if (currentPlannerId) {
            updatePlannerProgress(flowHours);
        }

        // Update the existing record to include flow duration
        var records = JSON.parse(localStorage.getItem('dingding-records') || '[]');
        if (records.length > 0) {
            var last = records[records.length - 1];
            last.flowMinutes = Math.round(state.flowSeconds / 60);
            localStorage.setItem('dingding-records', JSON.stringify(records));
        }

        // Show completion screen with flow info
        var totalFocusMinutes = Math.round(state.elapsedSeconds / 60);
        var flowMinutes = Math.round(state.flowSeconds / 60);
        dom.finalDuration.textContent = totalFocusMinutes;
        dom.finalDing.textContent = state.dingCount;
        dom.finalWei.textContent = flowMinutes;

        // Update labels for flow completion
        var labels = dom.completionScreen.querySelectorAll('.completion-stat-label');
        if (labels.length >= 3) {
            labels[2].textContent = '泉涌时间(分钟)';
        }

        dom.completionScreen.querySelector('.completion-title').textContent = '思如泉涌！';
        dom.completionScreen.querySelector('.completion-subtitle').textContent = '灵感迸发，收获迷幻蘑菇 x1';

        state.isFlowMode = false;
        state.flowSeconds = 0;
        showScreen('completion');
    }

    // --- Flow Particles ---
    var flowParticlesList = [];
    var flowParticlesRunning = false;

    function startFlowParticles() {
        var canvas = dom.flowParticles;
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        flowParticlesList = [];
        flowParticlesRunning = true;

        var colors = ['#E040FB', '#AA00FF', '#00E5FF', '#76FF03', '#FFAB00', '#FF4081', '#7C4DFF', '#00BFA5'];
        for (var i = 0; i < 40; i++) {
            flowParticlesList.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 1.5,
                vy: -Math.random() * 1.5 - 0.5,
                r: Math.random() * 5 + 2,
                color: colors[Math.floor(Math.random() * colors.length)],
                alpha: Math.random() * 0.6 + 0.3,
                life: 1
            });
        }
        drawFlowParticles();
    }

    function drawFlowParticles() {
        if (!flowParticlesRunning) return;
        var canvas = dom.flowParticles;
        var ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        var colors = ['#E040FB', '#AA00FF', '#00E5FF', '#76FF03', '#FFAB00', '#FF4081', '#7C4DFF', '#00BFA5'];

        flowParticlesList.forEach(function (p) {
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= 0.002;

            if (p.alpha <= 0 || p.y < -10 || p.x < -10 || p.x > canvas.width + 10) {
                p.x = Math.random() * canvas.width;
                p.y = canvas.height + 10;
                p.alpha = Math.random() * 0.6 + 0.3;
                p.vx = (Math.random() - 0.5) * 1.5;
                p.vy = -Math.random() * 1.5 - 0.5;
                p.color = colors[Math.floor(Math.random() * colors.length)];
            }

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.alpha;
            ctx.fill();
            ctx.globalAlpha = 1;
        });

        state.flowAnimFrame = requestAnimationFrame(drawFlowParticles);
    }

    function stopFlowParticles() {
        flowParticlesRunning = false;
        if (state.flowAnimFrame) {
            cancelAnimationFrame(state.flowAnimFrame);
            state.flowAnimFrame = null;
        }
        var canvas = dom.flowParticles;
        var ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function playFlowSound() {
        try {
            var ctx = new (window.AudioContext || window.webkitAudioContext)();
            [523, 659, 784, 988, 1175].forEach(function (freq, i) {
                var o = ctx.createOscillator(), g = ctx.createGain();
                o.connect(g); g.connect(ctx.destination);
                o.frequency.value = freq; o.type = 'triangle';
                var t = ctx.currentTime + i * 0.12;
                g.gain.setValueAtTime(0.2, t);
                g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
                o.start(t); o.stop(t + 0.6);
            });
            setTimeout(function () { ctx.close(); }, 2000);
        } catch (e) {}
    }

    // --- Complete ---
    function completeTimer() {
        clearInterval(state.timerInterval);
        state.timerInterval = null;
        dom.timeDisplay.classList.remove('running');
        playCompletionSound();

        // Calculate completed hours
        var completedHours = state.elapsedSeconds / 3600;

        // Save record
        if (!state.recorded) {
            saveRecord(true);
            state.recorded = true;
            // Drop: completed task gives 1 甜甜花苗 + 2 小水滴
            Garden.addItem('sweet_seedling', 1);
            Garden.addItem('water_drop', 2);

            // Update planner progress
            if (currentPlannerId) {
                updatePlannerProgress(completedHours);
            }
        }

        dom.finalDuration.textContent = Math.round(state.elapsedSeconds / 60);
        dom.finalDing.textContent = state.dingCount;
        dom.finalWei.textContent = state.weiCount;
        showScreen('completion');
    }

    // --- Reset ---
    function resetToSetup(fromCompletion) {
        // If in flow mode, end it instead of resetting
        if (state.isFlowMode) {
            endFlowState();
            return;
        }

        // Calculate completed hours before reset
        var completedHours = state.elapsedSeconds / 3600;

        // Save incomplete record if timer was running
        if (!fromCompletion && state.timerInterval && state.elapsedSeconds > 10 && !state.recorded) {
            saveRecord(false);
            state.recorded = true;
            // Drop: failed task gives 1 枯萎的甜甜花
            Garden.addItem('wilted_flower', 1);

            // Update planner progress even if abandoned (still count the time spent)
            if (currentPlannerId) {
                updatePlannerProgress(completedHours);
            }
        }

        if (state.timerInterval) {
            clearInterval(state.timerInterval);
            state.timerInterval = null;
        }
        dom.timeDisplay.classList.remove('running');
        dom.flower.classList.remove('wilted');

        // Clean up flow mode visuals (in case)
        document.body.classList.remove('flow-mode');
        stopFlowParticles();

        // Reset stat labels to default
        var timeLabel = dom.timeDisplay.closest('.stat-item').querySelector('.stat-label');
        if (timeLabel) timeLabel.textContent = '剩余时间';
        dom.resetBtn.textContent = '我承认，我萎了';

        // Reset completion screen labels
        var labels = dom.completionScreen.querySelectorAll('.completion-stat-label');
        if (labels.length >= 3) labels[2].textContent = '萎的次数';
        var compTitle = dom.completionScreen.querySelector('.completion-title');
        if (compTitle) compTitle.textContent = '专注完成！';
        var compSub = dom.completionScreen.querySelector('.completion-subtitle');
        if (compSub) compSub.textContent = '辛苦了，休息一下吧';

        // Reset setup to phase 1
        dom.setupPhase1.style.display = '';
        dom.setupPhase2.classList.add('hidden');

        // Reset planner context
        hidePlannerBanner();
        dom.timerPlannerInfo.classList.add('hidden');
        dom.viewBtns.forEach(function (btn) {
            btn.classList.toggle('active', btn.dataset.view === 'quick');
        });

        showScreen('setup');
    }

    // --- Show Screen ---
    function showScreen(name) {
        dom.setupScreen.classList.add('hidden');
        dom.timerScreen.classList.add('hidden');
        dom.completionScreen.classList.add('hidden');
        dom.modal.classList.add('hidden');

        switch (name) {
            case 'setup': dom.setupScreen.classList.remove('hidden'); break;
            case 'timer': dom.timerScreen.classList.remove('hidden'); break;
            case 'completion': dom.completionScreen.classList.remove('hidden'); break;
        }
    }

    // --- Update Display ---
    function updateDisplay() {
        dom.timeDisplay.textContent = formatMMSS(state.remainingSeconds);
        dom.dingCount.textContent = state.dingCount;
        dom.weiCount.textContent = state.weiCount;
    }

    function updateFlower() {
        if (state.weiCount > 1) {
            dom.flower.classList.add('wilted');
        } else {
            dom.flower.classList.remove('wilted');
        }
    }

    // --- Format ---
    function formatMMSS(totalSeconds) {
        var mins = Math.floor(totalSeconds / 60);
        var secs = totalSeconds % 60;
        return String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
    }

    function formatElapsedTime(totalSeconds) {
        var mins = Math.floor(totalSeconds / 60);
        var secs = totalSeconds % 60;
        if (mins === 0) return secs + '秒';
        if (secs === 0) return mins + '分钟';
        return mins + '分' + secs + '秒';
    }

    // --- Records / localStorage ---
    function saveRecord(completed) {
        var records = JSON.parse(localStorage.getItem('dingding-records') || '[]');
        var t = state.startTime || new Date();

        var record = {
            year: t.getFullYear(),
            month: t.getMonth() + 1,
            day: t.getDate(),
            hour: t.getHours(),
            durationMinutes: state.durationMinutes,
            elapsedMinutes: Math.round(state.elapsedSeconds / 60),
            name: state.taskName,
            ding: state.dingCount,
            wei: state.weiCount,
            completed: completed
        };

        // Mark if from planner
        if (currentPlannerId) {
            var task = Planner.getTask(currentPlannerId);
            if (task) {
                record.fromPlanner = true;
                record.plannerTaskName = task.name;
            }
        }

        records.push(record);
        localStorage.setItem('dingding-records', JSON.stringify(records));
    }

    function getQualityText(record) {
        if (!record.completed) return '拉完了';
        var diff = record.ding - record.wei;
        if (diff > 0) return '夯得一批';
        if (diff === 0) return '平庸的';
        return '拉完了';
    }

    function getQualityClass(record) {
        if (!record.completed) return 'quality-low';
        var diff = record.ding - record.wei;
        if (diff > 0) return 'quality-high';
        if (diff === 0) return 'quality-mid';
        return 'quality-low';
    }

    function renderNotebook() {
        var records = JSON.parse(localStorage.getItem('dingding-records') || '[]');

        if (records.length === 0) {
            dom.recordsList.innerHTML = '';
            dom.emptyState.classList.remove('hidden');
            dom.clearRecordsBtn.classList.add('hidden');
            dom.notebookSubtitle.textContent = '';
            return;
        }

        dom.emptyState.classList.add('hidden');
        dom.clearRecordsBtn.classList.remove('hidden');
        dom.notebookSubtitle.textContent = '共 ' + records.length + ' 条记录';

        dom.recordsList.innerHTML = records.slice().reverse().map(function (record) {
            var timeStr = formatRecordTime(record);
            var dur = record.durationMinutes || '?';
            var text;

            if (!record.completed) {
                var elapsed = record.elapsedMinutes || '?';
                var plannerTag = record.fromPlanner ? '📋 ' : '';
                text = timeStr + '，你进行了' + dur + '分钟的"' + plannerTag + record.name + '"的专注任务，' +
                    '然而在' + elapsed + '分钟的时候，你就萎了，你放弃了任务，' +
                    '做了一次<span class="quality-low">窝囊废</span>';
            } else {
                var qt = getQualityText(record);
                var qc = getQualityClass(record);
                var plannerTag = record.fromPlanner ? '📋 ' : '';
                text = timeStr + '，你进行了' + dur + '分钟的"' + plannerTag + record.name + '"的专注任务，' +
                    '过程中你顶了' + record.ding + '次，萎了' + record.wei + '次，' +
                    '你进入了<span class="' + qc + '">' + qt + '</span>的心流';
                // Flow state addition
                if (record.flowMinutes && record.flowMinutes > 0) {
                    text += '，随后他思如泉涌，灵感迸发了<span class="quality-flow">' + record.flowMinutes + '</span>分钟';
                }
            }

            return '<div class="record-entry glass-card">' +
                '<p class="record-text">' + text + '</p>' +
                '</div>';
        }).join('');
    }

    function formatRecordTime(record) {
        // New format: "2026年下午2点"
        if (record.year) {
            var h = record.hour;
            var period = h < 12 ? '上午' : '下午';
            var displayHour = h % 12;
            if (displayHour === 0) displayHour = 12;
            return record.year + '年' + period + displayHour + '点';
        }
        // Backward compat for old records with date field
        return record.date || '未知时间';
    }
