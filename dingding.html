        SPRITES.dingding_ball = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32"><rect x="6" y="4" width="4" height="1" fill="#5b8dd9"/><rect x="5" y="5" width="6" height="1" fill="#4a7dcf"/><rect x="4" y="6" width="8" height="4" fill="#3a6dbf"/><rect x="5" y="10" width="6" height="1" fill="#4a7dcf"/><rect x="6" y="11" width="4" height="1" fill="#5b8dd9"/><rect x="6" y="5" width="2" height="2" fill="#8bb8ff" opacity="0.7"/><rect x="5" y="7" width="1" height="1" fill="#a0ccff" opacity="0.4"/></svg>';

        SPRITES.wilted_flower = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32"><rect x="7" y="9" width="2" height="5" fill="#5a5a3a"/><path d="M8,9 L6,7 L8,5 L10,7 Z" fill="#8a7a3a"/><rect x="7" y="4" width="2" height="2" fill="#9a8a4a" opacity="0.6"/><rect x="6" y="6" width="4" height="2" fill="#7a6a2a" opacity="0.7"/><rect x="9" y="10" width="3" height="1" fill="#5a5a3a" opacity="0.5"/><rect x="5" y="14" width="6" height="1" fill="#8B6914"/></svg>';

        SPRITES.flower_stage1 = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32"><rect x="7" y="9" width="2" height="5" fill="#4a7c3f"/><rect x="5" y="10" width="3" height="2" fill="#6abf4b"/><rect x="6" y="6" width="4" height="4" fill="#8cd96c"/><rect x="7" y="5" width="2" height="2" fill="#ffe066"/><rect x="6" y="4" width="4" height="2" fill="#ffd54f"/><rect x="7" y="3" width="2" height="2" fill="#ffca28"/><rect x="5" y="14" width="6" height="1" fill="#8B6914"/></svg>';

        SPRITES.flower_stage2 = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32"><rect x="7" y="8" width="2" height="6" fill="#4a7c3f"/><rect x="4" y="10" width="3" height="2" fill="#6abf4b"/><rect x="10" y="9" width="2" height="2" fill="#6abf4b"/><rect x="5" y="5" width="6" height="4" fill="#a8e06c"/><rect x="6" y="4" width="4" height="2" fill="#ffe082"/><rect x="5" y="3" width="6" height="2" fill="#ffd54f"/><rect x="7" y="2" width="2" height="2" fill="#ffca28"/><rect x="5" y="14" width="6" height="1" fill="#8B6914"/></svg>';

        SPRITES.flower_stage3 = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32"><rect x="7" y="8" width="2" height="6" fill="#3d6b35"/><rect x="4" y="10" width="3" height="2" fill="#5aad40"/><rect x="10" y="9" width="3" height="2" fill="#5aad40"/><rect x="4" y="4" width="8" height="5" fill="#8cd96c"/><rect x="5" y="3" width="6" height="2" fill="#ffe082"/><rect x="4" y="2" width="8" height="2" fill="#ffd54f"/><rect x="6" y="1" width="4" height="2" fill="#ffca28"/><rect x="7" y="0" width="2" height="2" fill="#ff9800"/><rect x="5" y="14" width="6" height="1" fill="#8B6914"/></svg>';

        SPRITES.flower_king = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32"><rect x="7" y="9" width="2" height="5" fill="#2e5c27"/><rect x="3" y="11" width="4" height="2" fill="#4a9e35"/><rect x="10" y="10" width="4" height="2" fill="#4a9e35"/><rect x="3" y="4" width="10" height="6" fill="#7cc85e"/><rect x="4" y="3" width="8" height="2" fill="#ffd54f"/><rect x="3" y="2" width="10" height="2" fill="#ffc107"/><rect x="5" y="1" width="6" height="2" fill="#ff9800"/><rect x="6" y="0" width="4" height="2" fill="#ff6f00"/><rect x="7" y="0" width="2" height="1" fill="#e65100"/><rect x="5" y="14" width="6" height="1" fill="#8B6914"/><rect x="4" y="5" width="2" height="2" fill="#fff59d" opacity="0.5"/></svg>';

        SPRITES.golden_hamster = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32"><rect x="4" y="3" width="2" height="2" fill="#c9a033"/><rect x="10" y="3" width="2" height="2" fill="#c9a033"/><rect x="3" y="5" width="10" height="6" fill="#f5c842"/><rect x="4" y="4" width="8" height="2" fill="#e8b830"/><rect x="5" y="11" width="2" height="2" fill="#d4a020"/><rect x="9" y="11" width="2" height="2" fill="#d4a020"/><rect x="5" y="6" width="2" height="2" fill="#2c2c2c"/><rect x="9" y="6" width="2" height="2" fill="#2c2c2c"/><rect x="7" y="8" width="2" height="1" fill="#ff8a80"/><rect x="6" y="9" width="4" height="1" fill="#ffab91" opacity="0.6"/><rect x="6" y="7" width="1" height="1" fill="#fff" opacity="0.7"/><rect x="10" y="7" width="1" height="1" fill="#fff" opacity="0.7"/><rect x="3" y="7" width="1" height="3" fill="#f5c842" opacity="0.7"/><rect x="12" y="7" width="1" height="3" fill="#f5c842" opacity="0.7"/></svg>';

        SPRITES.psychedelic_mushroom = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32"><rect x="6" y="9" width="4" height="5" fill="#f3e5f5"/><rect x="7" y="10" width="1" height="3" fill="#ede7f6" opacity="0.6"/><rect x="4" y="4" width="8" height="6" rx="0" fill="#ab47bc"/><rect x="3" y="5" width="10" height="4" fill="#8e24aa"/><rect x="5" y="3" width="6" height="2" fill="#ce93d8"/><rect x="5" y="5" width="2" height="2" fill="#f3e5f5" opacity="0.8"/><rect x="9" y="4" width="3" height="3" fill="#f3e5f5" opacity="0.7"/><rect x="7" y="7" width="2" height="1" fill="#f3e5f5" opacity="0.6"/><rect x="5" y="14" width="6" height="1" fill="#6a1b9a" opacity="0.3"/></svg>';

        // --- Data helpers ---
        function loadData() {
            var raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return defaultData();
            try { return JSON.parse(raw); } catch (e) { return defaultData(); }
        }

        function defaultData() {
            return {
                storage: [],  // [{type, count}]
                garden: []    // [{type, plantedDate, lastWatered, wateredToday}] (length up to GARDEN_SLOTS)
            };
        }

        function saveData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function getTodayStr() {
            var d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        function getYesterdayStr() {
            var d = new Date();
            d.setDate(d.getDate() - 1);
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        function totalStorageCount(data) {
            var total = 0;
            data.storage.forEach(function (s) { total += s.count; });
            return total;
        }

        // --- Public: add item to storage ---
        function addItem(type, count) {
            var data = loadData();
            if (totalStorageCount(data) + count > MAX_STORAGE) {
                count = MAX_STORAGE - totalStorageCount(data);
                if (count <= 0) return;
            }
            var existing = null;
            for (var i = 0; i < data.storage.length; i++) {
                if (data.storage[i].type === type) { existing = data.storage[i]; break; }
            }
            if (existing) {
                existing.count += count;
            } else {
                if (data.storage.length < STORAGE_SLOTS) {
                    data.storage.push({ type: type, count: count });
                } else {
                    return; // no empty slot
                }
            }
            saveData(data);
        }

        // --- Selection state ---
        var selectedStorage = -1; // index in storage array
        var selectedGarden = -1;  // index in garden array

        // --- Check growth (called on tab open) ---
        function checkGrowth() {
            var data = loadData();
            var today = getTodayStr();
            var yesterday = getYesterdayStr();
            var changed = false;

            data.garden.forEach(function (plot) {
                if (!plot || !plot.type) return;
                var itemDef = ITEMS[plot.type];
                if (!itemDef || itemDef.stage === undefined) return;
                // If watered yesterday, and growth hasn't been applied yet today
                if (plot.lastWatered === yesterday && plot.grewOn !== today) {
                    var currentStage = itemDef.stage;
                    if (currentStage < 4) { // Can still grow (not king flower or hamster)
                        var nextType = GROWTH_PATH[currentStage + 1];
                        plot.type = nextType;
                        plot.grewOn = today;
                        changed = true;
                    }
                }
                // Reset wateredToday if it's a new day
                if (plot.wateredToday && plot.wateredToday !== today) {
                    plot.wateredToday = null;
                    changed = true;
                }
            });

            if (changed) saveData(data);
        }

        // --- Render the garden UI ---
        function render() {
            var data = loadData();
            selectedStorage = -1;
            selectedGarden = -1;
            dom.gardenActionInfo.classList.add('hidden');

            renderGardenGrid(data);
            renderStorageGrid(data);
            dom.gardenCount.textContent = data.garden.length + ' / ' + GARDEN_SLOTS;
            dom.storageCount.textContent = totalStorageCount(data) + ' / ' + MAX_STORAGE;
        }

        function renderGardenGrid(data) {
            var html = '';
            for (var i = 0; i < GARDEN_SLOTS; i++) {
                var plot = data.garden[i];
                if (plot && plot.type) {
                    var today = getTodayStr();
                    var isWatered = plot.wateredToday === today;
                    var cls = 'pixel-slot' + (isWatered ? ' watered' : '');
                    html += '<div class="' + cls + '" data-garden-idx="' + i + '">';
                    if (isWatered) html += '<span class="watered-indicator">💧</span>';
                    html += '<div class="pixel-sprite">' + (SPRITES[plot.type] || '') + '</div>';
                    html += '<span class="item-name-label">' + (ITEMS[plot.type] ? ITEMS[plot.type].name : '') + '</span>';
                    html += '</div>';
                } else {
                    html += '<div class="pixel-slot empty" data-garden-idx="' + i + '">';
                    html += '<span class="item-name-label" style="opacity:0.25">空地</span>';
                    html += '</div>';
                }
            }
            dom.gardenGrid.innerHTML = html;

            // Bind clicks
            dom.gardenGrid.querySelectorAll('.pixel-slot').forEach(function (el) {
                el.addEventListener('click', function () {
                    var idx = parseInt(this.dataset.gardenIdx, 10);
                    onGardenSlotClick(idx);
                });
            });
        }

        function renderStorageGrid(data) {
            var html = '';
            for (var i = 0; i < STORAGE_SLOTS; i++) {
                var item = data.storage[i];
                if (item && item.count > 0) {
                    html += '<div class="pixel-slot" data-storage-idx="' + i + '">';
                    html += '<div class="pixel-sprite">' + (SPRITES[item.type] || '') + '</div>';
                    html += '<span class="item-name-label">' + (ITEMS[item.type] ? ITEMS[item.type].name : '') + '</span>';
                    if (item.count > 1) html += '<span class="item-count-badge">' + item.count + '</span>';
                    html += '</div>';
                } else {
                    html += '<div class="pixel-slot empty" data-storage-idx="' + i + '">';
                    html += '</div>';
                }
            }
            dom.storageGrid.innerHTML = html;

            // Bind clicks
            dom.storageGrid.querySelectorAll('.pixel-slot').forEach(function (el) {
                el.addEventListener('click', function () {
                    var idx = parseInt(this.dataset.storageIdx, 10);
                    onStorageSlotClick(idx);
                });
            });
        }

        // --- Interactions ---
        function onStorageSlotClick(idx) {
            var data = loadData();
            var item = data.storage[idx];
            if (!item || item.count <= 0) return;

            selectedStorage = idx;
            selectedGarden = -1;

            // Clear garden selection visuals
            dom.gardenGrid.querySelectorAll('.pixel-slot').forEach(function (el) { el.classList.remove('selected'); });
            dom.storageGrid.querySelectorAll('.pixel-slot').forEach(function (el) { el.classList.remove('selected'); });
            dom.storageGrid.querySelector('[data-storage-idx="' + idx + '"]').classList.add('selected');

            showStorageActions(data, idx);
        }

        function onGardenSlotClick(idx) {
            var data = loadData();
            var plot = data.garden[idx];

            selectedGarden = idx;

            // Clear selection visuals
            dom.gardenGrid.querySelectorAll('.pixel-slot').forEach(function (el) { el.classList.remove('selected'); });
            dom.storageGrid.querySelectorAll('.pixel-slot').forEach(function (el) { el.classList.remove('selected'); });

            var el = dom.gardenGrid.querySelector('[data-garden-idx="' + idx + '"]');
            if (el) el.classList.add('selected');

            // If a storage item is selected and this is an empty plot, try planting
            if (selectedStorage >= 0) {
                var storageItem = data.storage[selectedStorage];
                if (storageItem && ITEMS[storageItem.type] && ITEMS[storageItem.type].plantable && !plot) {
                    doPlant(selectedStorage, idx);
                    return;
                }
            }
            selectedStorage = -1;

            if (plot && plot.type) {
                showGardenPlotActions(data, idx);
            } else {
                showEmptyPlotActions(idx);
            }
        }

        function showStorageActions(data, idx) {
            var item = data.storage[idx];
            var info = ITEMS[item.type];
            var panel = dom.gardenActionInfo;
            panel.classList.remove('hidden');

            var btnsHtml = '';
            if (info && info.plantable) {
                btnsHtml = '<button class="garden-act-btn primary" id="act-plant-select">种到花园</button>';
            }

            panel.innerHTML =
                '<div class="garden-action-title">' + info.name + ' x' + item.count + '</div>' +
                '<div class="garden-action-desc">' + info.desc + '</div>' +
                (btnsHtml ? '<div class="garden-action-btns">' + btnsHtml + '</div>' : '');

            if (info && info.plantable) {
                document.getElementById('act-plant-select').addEventListener('click', function () {
                    showToast('请点击花园中的空地来种植');
                });
            }
        }

        function showEmptyPlotActions(idx) {
            var panel = dom.gardenActionInfo;
            panel.classList.remove('hidden');
            panel.innerHTML =
                '<div class="garden-action-title">空地</div>' +
                '<div class="garden-action-desc">从储物袋中选择甜甜花苗来种植</div>';
        }

        function showGardenPlotActions(data, gardenIdx) {
            var plot = data.garden[gardenIdx];
            var info = ITEMS[plot.type];
            var panel = dom.gardenActionInfo;
            panel.classList.remove('hidden');

            var today = getTodayStr();
            var isWatered = plot.wateredToday === today;
            var stage = info ? info.stage : -1;

            var btnsHtml = '';
            // Water button (if has water drops and not already watered today)
            var waterCount = getItemCount(data, 'water_drop');
            if (!isWatered && stage >= 0 && stage < 4 && waterCount > 0) {
                btnsHtml += '<button class="garden-act-btn primary" id="act-water">浇水 (💧x1)</button>';
            } else if (isWatered && stage < 4) {
                btnsHtml += '<button class="garden-act-btn" disabled>今日已浇水 ✓</button>';
            }

            // Ding ball boost (if has ding balls and flower can grow)
            var ballCount = getItemCount(data, 'dingding_ball');
            if (stage >= 0 && stage < 4 && ballCount > 0) {
                btnsHtml += '<button class="garden-act-btn" id="act-boost">顶顶球加速</button>';
            }

            // King flower + ding ball = golden hamster
            if (stage === 4 && ballCount > 0) {
                btnsHtml += '<button class="garden-act-btn primary" id="act-evolve">喂顶顶球 ✨</button>';
            }

            // Harvest / Remove
            btnsHtml += '<button class="garden-act-btn" id="act-harvest">移除</button>';

            var statusText = '';
            if (isWatered) statusText = '今日已浇水 💧';
            else if (stage >= 0 && stage < 4) statusText = '需要浇水才能成长';
            else if (stage === 4) statusText = '已完全成长！可以喂顶顶球';
            else if (stage === 5) statusText = '黄金仓鼠！花园的骄傲';

            panel.innerHTML =
                '<div class="garden-action-title">' + (info ? info.name : '') + '</div>' +
                '<div class="garden-action-desc">' + statusText + '</div>' +
                '<div class="garden-action-btns">' + btnsHtml + '</div>';

            // Bind actions
            var waterBtn = document.getElementById('act-water');
            if (waterBtn) waterBtn.addEventListener('click', function () { doWater(gardenIdx); });

            var boostBtn = document.getElementById('act-boost');
            if (boostBtn) boostBtn.addEventListener('click', function () { doBoost(gardenIdx); });

            var evolveBtn = document.getElementById('act-evolve');
            if (evolveBtn) evolveBtn.addEventListener('click', function () { doEvolve(gardenIdx); });

            var harvestBtn = document.getElementById('act-harvest');
            if (harvestBtn) harvestBtn.addEventListener('click', function () { doHarvest(gardenIdx); });
        }

        // --- Actions ---
        function doPlant(storageIdx, gardenIdx) {
            var data = loadData();
            var item = data.storage[storageIdx];
            if (!item || item.count <= 0) return;
            if (data.garden[gardenIdx]) return; // occupied

            // Place in garden
            data.garden[gardenIdx] = {
                type: item.type,
                plantedDate: getTodayStr(),
                lastWatered: null,
                wateredToday: null,
                grewOn: null
            };

            // Remove from storage
            item.count--;
            if (item.count <= 0) data.storage.splice(storageIdx, 1);

            saveData(data);
            showToast('种下了一棵' + ITEMS[item.type].name + '！');
            render();
        }

        function doWater(gardenIdx) {
            var data = loadData();
            var plot = data.garden[gardenIdx];
            if (!plot) return;

            // Use water drop
            if (!useItem(data, 'water_drop', 1)) {
                showToast('没有小水滴了！');
                return;
            }

            var today = getTodayStr();
            plot.lastWatered = today;
            plot.wateredToday = today;

            saveData(data);
            showToast('浇水成功！明天花儿会成长 🌱');
            render();
        }

        function doBoost(gardenIdx) {
            var data = loadData();
            var plot = data.garden[gardenIdx];
            if (!plot) return;

            var info = ITEMS[plot.type];
            if (!info || info.stage === undefined || info.stage >= 4) return;

            if (!useItem(data, 'dingding_ball', 1)) {
                showToast('没有顶顶球了！');
                return;
            }

            // Advance one stage
            var nextType = GROWTH_PATH[info.stage + 1];
            plot.type = nextType;
            plot.grewOn = getTodayStr();

            saveData(data);
            showToast('顶顶球加速成长！→ ' + ITEMS[nextType].name);
            render();
        }

        function doEvolve(gardenIdx) {
            var data = loadData();
            var plot = data.garden[gardenIdx];
            if (!plot || plot.type !== 'flower_king') return;

            if (!useItem(data, 'dingding_ball', 1)) {
                showToast('没有顶顶球了！');
                return;
            }

            plot.type = 'golden_hamster';
            plot.grewOn = getTodayStr();

            saveData(data);
            showToast('甜甜大王花变成了黄金仓鼠！🐹✨');
            render();
        }

        function doHarvest(gardenIdx) {
            var data = loadData();
            // Remove from garden (shift to fill)
            data.garden.splice(gardenIdx, 1);
            saveData(data);
            showToast('移除成功');
            render();
        }

        // --- Helpers ---
        function getItemCount(data, type) {
            for (var i = 0; i < data.storage.length; i++) {
                if (data.storage[i].type === type) return data.storage[i].count;
            }
            return 0;
        }

        function useItem(data, type, count) {
            for (var i = 0; i < data.storage.length; i++) {
                if (data.storage[i].type === type && data.storage[i].count >= count) {
                    data.storage[i].count -= count;
                    if (data.storage[i].count <= 0) data.storage.splice(i, 1);
                    return true;
                }
            }
            return false;
        }

        // --- Toast ---
        var toastTimer = null;
        function showToast(msg) {
            dom.gardenToast.textContent = msg;
            dom.gardenToast.classList.remove('hidden');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(function () {
                dom.gardenToast.classList.add('hidden');
            }, 2200);
        }

        return {
            addItem: addItem,
            checkGrowth: checkGrowth,
            render: render
        };
    })();

    // --- Boot ---
    init();
})();
    </script>
